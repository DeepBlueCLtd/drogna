# Visual capture, in CI.
#
# Two jobs for two of the three mechanisms, and deliberately none for the third.
#
# **No glance job.** The glance exists to show an author what the client looks like during
# a session. Nobody is in a session here, nothing would look at the image, and a glance is
# the one mechanism with no gate and no retention rule — so a CI job producing them would
# be producing artefacts nobody reads under a rule nobody wrote (FR-021).
#
# **The pair runs on pull requests**, with a declared artefact retention period, because a
# pair's life is the life of the branch (FR-012). Its output is never committed.
#
# **The curated capture is manual only.** It produces a reviewable candidate and this
# workflow does not commit it. A workflow that committed a picture to a public site would
# have turned an author's judgement into a default, and PR-01 review is exactly the
# judgement that cannot be defaulted (FR-013, FR-021).
name: Capture

on:
  pull_request:
  workflow_dispatch:
    inputs:
      name:
        description: "Candidate name, as <feature-number>-<slug> (curated capture only)"
        required: true
        type: string
      caption:
        description: "Alt text for the blog entry"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: capture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The capture tooling's own tests: the separation test and its merged-tree control, the
  # fingerprint refusals, the comparator and its one-pixel control, the provenance leak
  # checks and the curated-image dimensions. None of them needs a browser or a running
  # client, so they run first and fail fast — a broken comparator makes every job below
  # meaningless.
  tooling:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm run typecheck:capture

      - name: Tests
        run: pnpm exec vitest run e2e/tests

  # The pair, against a client this job builds and serves. Both halves are captured in the
  # same environment, which is what the fingerprint's `capture.environment` field records
  # and refuses on: a pair with one half taken locally and one here is not a pair (FR-010).
  pair:
    runs-on: ubuntu-latest
    needs: tooling
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: client
    # HARNESS_CONFIG is deliberately not set at job level any more. The page is served
    # through the proxy behind its clearance (issue #34, link 6), so a capture must read
    # the *rendered* capture document — the render is what puts the credential in, and the
    # tracked document names nobody. Which document exists depends on whether the bring-up
    # ran, so the choice is made in its own step below and published through GITHUB_ENV.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # The version comes from client/package.json, which is the same pin the capture
      # configuration records and the fingerprint compares against. Installing "latest"
      # here would make a pair captured today incomparable with one captured tomorrow for
      # reasons nobody chose.
      - name: Install the pinned browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the client
        run: pnpm build

      # scripts/up.sh validates the destination's configuration before it starts anything,
      # and that validation is Python: it reads the schemas under contracts/ through
      # jsonschema and referencing. This job had only Node, so the very first thing the
      # bring-up did was fail on `ModuleNotFoundError: No module named 'referencing'` — in
      # well under a second, which is what made three rounds of diagnosis look like a
      # working-directory problem and then a rendering problem.
      #
      # The same two steps ci.yml uses, so the workspace is installed the one way.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        working-directory: ${{ github.workspace }}
        run: uv sync --frozen

      # Bring the harness up, rather than serving the client on its own.
      #
      # Until now this job served the built client with `vite preview` and nothing else, and
      # said so: no clock answered, no ctl/clock sample arrived, the pin the pair requires
      # could never be acknowledged, and every capture this repository has ever produced is
      # of a shell with nothing lit. The runner has a container runtime and this container
      # does not, so this is the only place the whole thing can actually run.
      #
      # DROGNA_PROFILES overrides the destination's profiles.active for this invocation.
      # Both destinations name `core`, which is the observation store alone — step 5 of
      # deploy/README.md's "adding a component" has never been performed for any of the
      # sixteen components that now exist, so `scripts/up.sh` starts Postgres and stops.
      # Changing that is a decision about what a destination runs; borrowing four profiles
      # for a capture job is not, and the override exists so the two stay separable.
      #
      # The proxy publishes on the address config/local/capture.json already names — one
      # door, the page behind the clearance — so nothing here bends the configuration to
      # fit the job. The proxy's rendered nginx now also names `client` and `clock` as
      # upstreams (the page and FR-74's clock strand), which `shell` and `foundation`
      # provide; nginx resolves every upstream at config load, so all three are start-up
      # dependencies of the boundary, and deploy/compose.yaml says so.
      #
      # This step is allowed to fail. It is the first time the stack has been brought up
      # anywhere, the profile set below is reasoned from deploy/compose.yaml rather than
      # observed, and the step after it reports what happened either way. A red cross here
      # would say nothing a reader could act on; the report does.
      - name: Bring the harness up
        id: stack
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          # Reasoned from deploy/compose.yaml rather than observed. The client needs the
          # proxy, because its broker URL is the proxy's upgrade location (ADR-0008); the
          # proxy's rendered nginx names `query` as an upstream and nginx resolves an
          # upstream at config load, so `query` has to be up for the proxy to start at
          # all; and `query` depends_on `observations`, which is what `core` is. The
          # clock and the broker are the two that actually light anything.
          DROGNA_PROFILES: core,broker,foundation,query,edge,shell
        run: |
          set -o pipefail
          ./scripts/up.sh local 2>&1 | tee "${RUNNER_TEMP}/bringup.log"

      # The rendered document where the render produced one, the tracked one where it did
      # not. The rendered document carries the clearance the page's challenge demands; the
      # tracked one names nobody, which is exactly right for the preview fallback below —
      # a preview serves the page with no challenge, and the mechanisms present a
      # credential only when the document carries a secret.
      - name: Point the captures at the document that matches what is serving
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f deploy/.runtime/config/local/capture.json ]; then
            echo "HARNESS_CONFIG=deploy/.runtime/config/local/capture.json" >> "$GITHUB_ENV"
            echo "captures read the rendered document, credential included"
          else
            echo "HARNESS_CONFIG=config/local/capture.json" >> "$GITHUB_ENV"
            echo "no rendered document exists, so the captures read the tracked one, which"
            echo "names nobody — right for a preview, refused by a stack, either way loud"
          fi

      - name: Say what came up
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          # Where this ran and what the bring-up concluded, stated rather than inferred.
          # Two rounds were spent guessing at a step that failed in under a second, and a
          # step that reports its own working directory would have answered it at once.
          echo "working directory: $(pwd)"
          echo "bring-up outcome: ${{ steps.stack.outcome }}"
          echo
          if [ "${{ steps.stack.outcome }}" = "success" ]; then
            echo "The stack is up. Services and their state:"
          else
            echo "The stack did not come up, and the step above says why. The capture below"
            echo "will refuse rather than photograph a client with nothing behind it, which"
            echo "is the correct outcome and not a silent pass."
            echo
            echo "What is most likely, in order: a profile in the set above pulls in a"
            echo "service whose health check cannot pass without another that is absent; a"
            echo "one-shot job never becomes healthy and --wait times out; or an image fails"
            echo "to build. The service table below distinguishes them."
          fi
          docker compose --file deploy/compose.yaml --env-file deploy/.env ps || true
          docker compose --file deploy/compose.yaml --env-file deploy/.env logs --tail 40 || true

      # The client is answering when the stack reports it healthy; the loop below is the one
      # wait in this feature measured in real seconds, and it is test-harness setup rather
      # than a capture path. Every wait inside a capture is on the client's own readiness
      # signal, and scripts/check_no_fixed_sleep.py enforces that over client/e2e/ and
      # scripts/capture/.
      # A client must be answering whatever the stack did, because the determinism specs
      # below are the part of the pair mechanism that is load-bearing *without* a running
      # stack and they are not allowed to fail. Serving the client from the stack alone made
      # them depend on the stack coming up, and the first run proved it: the bring-up failed,
      # the specs could not reach a client, and the job went red for a reason that had
      # nothing to do with the comparator they exist to prove.
      #
      # So: the stack's client where there is one, and `vite preview` where there is not.
      # The pair capture further down still refuses without a clock — that refusal is the
      # honest outcome and is reported rather than suppressed — but the comparator is
      # exercised either way, exactly as it was before the stack existed here.
      - name: Make sure a client is answering, from the stack or from a preview
        run: |
          url="$(node -e 'process.stdout.write(require(process.argv[1]).client.url)' "../${HARNESS_CONFIG}")"
          user="$(node -e 'process.stdout.write(require(process.argv[1]).client.credentials.user)' "../${HARNESS_CONFIG}")"
          secret="$(node -e 'process.stdout.write(require(process.argv[1]).client.credentials.secret)' "../${HARNESS_CONFIG}")"
          # The page sits behind the boundary's clearance, so this probe presents the same
          # credential the captures will — where the document carries one. Presenting
          # nothing to a stack answers 401, -f fails, and the loop would fall through to a
          # preview that cannot bind the proxy's published port: a loud wrong answer.
          auth=()
          if [ -n "$secret" ]; then
            auth=(-u "${user}:${secret}")
          fi
          for _ in $(seq 1 60); do
            if curl -fsS "${auth[@]}" -o /dev/null "$url"; then
              echo "the stack is serving the client at $url"
              exit 0
            fi
            sleep 1
          done

          echo "the stack is not serving a client at $url; falling back to a preview so the"
          echo "determinism specs still run. The pair capture will refuse, because a preview"
          echo "has no clock behind it, and that refusal is the correct outcome."
          host="$(node -e 'process.stdout.write(new URL(process.argv[1]).hostname)' "$url")"
          port="$(node -e 'process.stdout.write(new URL(process.argv[1]).port)' "$url")"
          nohup pnpm exec vite preview --host "$host" --port "$port" --strictPort \
            > ../capture-preview.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null "$url"; then
              echo "the preview is serving the client at $url"
              exit 0
            fi
            sleep 1
          done
          echo "neither the stack nor a preview answered at $url; the preview said:"
          cat ../capture-preview.log
          exit 1

      # The determinism specs are the pair mechanism's own: a no-change pair is empty three
      # times running, and the comparison catches a display that varies frame to frame.
      # They are what makes every later difference this mechanism produces mean anything.
      - name: The pair's determinism specs
        run: pnpm exec playwright test --config e2e/pair.config.ts e2e/specs/determinism.spec.ts

      # A pull request captures the "after" half. The "before" half comes from a run on the
      # base of the branch; where there is none, one half is produced and the diff is not
      # attempted, rather than the other half being invented.
      #
      # This step is allowed to fail without failing the job, and the step after it says
      # why it failed rather than leaving a red cross to be interpreted. The pair pins the
      # clock through the client's own rate control and waits for the clock to acknowledge
      # it (FR-007); with the stack up that request travels the one door — the page, the
      # credential and the clock all through the boundary — and where the bring-up failed
      # and a preview stands in, no clock answers and the capture refuses. That refusal is
      # the correct behaviour and it is loud, which is why it is reported rather than
      # suppressed. The determinism specs above are the part of the pair mechanism that is
      # load-bearing without a running stack, and they are not allowed to fail.
      - name: Capture the after half of a pair
        id: after
        continue-on-error: true
        run: node ../scripts/capture/pair/run.mjs after pull-request

      - name: Say what the pair capture did
        if: always()
        run: |
          if [ "${{ steps.after.outcome }}" = "success" ]; then
            echo "A half was captured. Its fingerprint:"
            cat ../.capture/pair/pull-request/after.fingerprint.json
          else
            echo "No half was captured, and the step above says why."
            echo
            echo "The commonest reason used to be that no clock was answering: this job"
            echo "served the built client and nothing else. It now brings the harness up,"
            echo "so read the stack report above first — if the clock did not start, the"
            echo "pin cannot be acknowledged and this refusal is the correct outcome rather"
            echo "than a silent pass, which is what FR-007 asks for."
          fi
          ls -R ../.capture/pair || echo "the pair area is empty"

      # Always, and before the artefact upload, so that a job cancelled mid-capture does not
      # leave containers holding the runner's ports. `down.sh` is the repository's own path
      # rather than a second spelling of it.
      - name: Take the harness down
        if: always()
        working-directory: ${{ github.workspace }}
        run: ./scripts/down.sh local || true

      # Repeated at the end of the job on purpose. The bring-up runs early and its output
      # is buried under a minute of connection attempts and a Playwright report, which made
      # three rounds of diagnosis a matter of inferring the cause from timings rather than
      # reading it. A job whose most likely failure is reported only at the top is a job
      # nobody reads the top of.
      - name: What the bring-up said, repeated where a reader will reach it
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          echo "bring-up outcome: ${{ steps.stack.outcome }}"
          echo
          cat "${RUNNER_TEMP}/bringup.log" 2>/dev/null || echo "the bring-up wrote no log"

      # The retention period is declared here and in the capture configuration, and they say
      # the same thing on purpose: a pair's life is the life of the branch, not for ever.
      - name: Keep the pair for as long as the branch needs it
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture-pair-${{ github.event.pull_request.number || github.run_id }}
          path: .capture/pair
          retention-days: 14
          if-no-files-found: warn

  # Manual only, and it commits nothing. What comes out is a candidate in an artefact; a
  # person downloads it, looks at it, and moves it into the published-screenshot location
  # by hand. That move is the PR-01 review gate.
  curated:
    runs-on: ubuntu-latest
    needs: tooling
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: client
    env:
      HARNESS_CONFIG: config/local/capture.json
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install the pinned browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build the client
        run: pnpm build

      # The loop below is the one wait in this feature measured in real seconds, and it is
      # test-harness setup rather than a capture path: it waits for a web server this job
      # started to bind a socket, which produces no readiness signal to wait on. Every wait
      # inside a capture is on the client's own readiness signal, and
      # scripts/check_no_fixed_sleep.py enforces that over client/e2e/ and scripts/capture/.
      - name: Serve the client
        run: |
          url="$(node -e 'process.stdout.write(require("../config/local/capture.json").client.url)')"
          host="$(node -e 'process.stdout.write(new URL(process.argv[1]).hostname)' "$url")"
          port="$(node -e 'process.stdout.write(new URL(process.argv[1]).port)' "$url")"
          nohup pnpm exec vite preview --host "$host" --port "$port" --strictPort \
            > ../capture-preview.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null "$url"; then
              echo "the client is answering at $url"
              exit 0
            fi
            sleep 1
          done
          echo "the client never answered at $url; the preview server said:"
          cat ../capture-preview.log
          exit 1

      - name: Produce a candidate
        run: >-
          node ../scripts/capture/curate/run.mjs
          "${{ inputs.name }}"
          "${{ inputs.caption }}"

      # Uploaded, not committed. The next step is a person's.
      - name: Offer the candidate for review
        uses: actions/upload-artifact@v4
        with:
          name: curated-candidate-${{ inputs.name }}
          path: .capture/curated
          retention-days: 30
          if-no-files-found: error

      - name: Say what happens next
        run: |
          echo "Nothing has been committed. Download the artefact, look at the image, and"
          echo "if it is worth publishing move both files into site/docs/blog/assets/ and"
          echo "commit them there. That move is the review gate, and it is yours."
