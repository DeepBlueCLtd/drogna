# The constitution's quality gates, run on every change.
#
# Gates 3 to 7 of the constitution's Development Workflow are the ones that cannot be
# checked by reading a diff: they enforce properties that hold across the whole tree.
# They run here and they fail the build.
name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # Tests come before the gates because the gates' own tests are here: they plant a
      # violation in a fixture and assert each gate reports it, and they hand the runner a
      # gate that must fail. A gate that has stopped matching looks exactly like a clean
      # tree, so the gate step below proves nothing unless these pass first.
      - name: Tests
        run: uv run pytest

      # One step, not seven. The gates are listed in scripts/gates.registry and the runner
      # reads that list, so the build and a contributor's terminal run the same set. A
      # second copy of the list here would be a copy that could fall behind, which is
      # exactly the failure a gate is supposed to prevent.
      - name: Gates (Constitution I, II, III, IV, V)
        run: ./scripts/gates.sh

  # The client has its own toolchain and its own tests, and they are no less part of the
  # build for being written in a different language. Kept as a separate job so a Python
  # failure and a client failure are told apart at a glance rather than by reading a log.
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      # An action's inputs are not affected by defaults.run.working-directory, so the
      # version has to be found through an explicit path. It is pinned in
      # client/package.json rather than here, so a contributor and the build resolve the
      # same pnpm instead of two that happen to agree today.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      # Feature 016 owns `client/e2e/`, which is type-checked against its own tsconfig
      # because the capture tooling runs in node rather than in a browser and needs node's
      # types, which the client itself deliberately does not have. Appended here rather
      # than folded into the step above so that a capture failure and a client failure are
      # told apart by their step name. The capture *specs* need a browser and a running
      # client and are in `.github/workflows/capture.yml`; this step needs neither.
      - name: Capture tooling types
        run: pnpm run typecheck:capture
