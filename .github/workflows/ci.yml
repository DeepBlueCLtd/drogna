# The constitution's quality gates, run on every change (constitution 2.0.0,
# Development Workflow). One toolchain now: everything below is pnpm and TypeScript.
#
# The gates run as one step, not six: the set lives in scripts/gates.registry and the
# runner reads that list, so the build and a contributor's terminal run the same set.
# A second copy of the list here would be a copy that could fall behind.
name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm -C app run typecheck

      - name: Lint
        run: pnpm -C app run lint

      # App tests before the gates, for the reason V1 recorded: the gates' own tests
      # are what prove a gate still catches its planted violation, and a gate that has
      # stopped matching looks exactly like a clean tree.
      - name: App tests
        run: pnpm -C app run test

      - name: Gate tests (each gate watched failing on its planted violation)
        run: pnpm run test

      - name: Gates (Constitution I, II, III, IV, V, XI)
        run: pnpm run gates

      # AT-04's one-command proof, run here because it was not: it had reported
      # "held" over a test it never ran since the 101-109 close-out, and nothing
      # noticed, because nothing ran it. The cheap half — that every
      # determinism-shaped test says whether it is in the proof — is
      # check-replay-markers in the step above and costs no test time. This is the
      # other half, and it re-runs the marked tests' files: about two minutes, paid
      # deliberately, because a proof of byte-identical replay that nobody executes
      # is exactly the check CLAUDE.md's second lesson is about.
      - name: 'AT-04 replay proof (byte-identical replay, its claim and its boundary)'
        run: pnpm run replay-proof

      - name: Build
        run: pnpm -C app run build

      # The glance proves the built shell actually runs in a browser — loads, answers
      # a seam request, pins the clock — not merely that it compiled (E15's lesson:
      # "delivered" is not "wired").
      - name: Install the capture browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Glance capture of the built shell
        run: pnpm run capture:glance operator

      # Feature 111's SC-005 and SC-006 are made by capture rather than by assertion,
      # and a proof nobody runs is a check that has never been seen to fail. This walks
      # all eleven explainers by keyboard alone, shoots each in colour and in greyscale,
      # and fails if a label is drawn outside its frame or a diagram refuses to draw at
      # a width that is plainly enough (FR-024).
      - name: Background course proofs (keyboard, greyscale, labels)
        run: pnpm run capture:background

      # Feature 115's SC-01 is the feature's yardstick and cannot be made by assertion:
      # it is a claim about a running page, not about a data structure. This runs the
      # harness, stops the sensors through the Operator tab's own control, and fails
      # unless the observation lane stills while the control lane goes on beating.
      - name: 'Messages traffic proof (SC-01: stopping the sensors stills a lane)'
        run: pnpm run capture:messages

      # Feature 115's SC-07 drives all three of the map's projections, because the fault
      # it exists against is invisible at any one of them: the volume drew no ownship
      # track at all, and a screenshot of the default projection would never have said so.
      - name: 'Map projection proof (SC-07: the track in all three projections)'
        run: pnpm run capture:map

      # Feature 112's SC-001 to SC-003, SC-008 and SC-010 are claims about geometry, and
      # an assertion over markup cannot see whether something fits. This walks every
      # configured view at three phone sizes and fails on a layout that scrolls sideways,
      # a tab a thumb cannot hit, chrome that has eaten the screen, or a Background step
      # that asks a phone to widen a window it cannot widen.
      - name: Narrow-presentation proofs (overflow, tap targets, chrome, the preview page)
        run: pnpm run capture:mobile

      # Feature 116's T035. The consumer tabs are swept by keyboard alone: every control
      # the panel declares has to be reachable, named and visibly focused, the map has to
      # zoom, pan and reset from the keys it advertises, and each tab is shot in colour and
      # in greyscale. The greyscale *bound* is a unit test (greyscale.test.ts) — a picture
      # nobody compares this month is a claim, not a check — so what runs here is the
      # keyboard proof, with the images as its illustration.
      - name: 'Consumer-tab proofs (keyboard reach, the map''s own keys, greyscale pair)'
        run: pnpm run capture:consumers

      - uses: actions/upload-artifact@v4
        with:
          name: glance
          path: .capture/
          if-no-files-found: error
          # .capture is a dotted directory, and upload-artifact treats a dotted path as
          # hidden and skips it by default — so the glance PNG was written and then
          # reported missing by the very next step. Watched failing on 101's own runs.
          include-hidden-files: true
