# The constitution's quality gates, run on every change.
#
# Gates 3 to 7 of the constitution's Development Workflow are the ones that cannot be
# checked by reading a diff: they enforce properties that hold across the whole tree.
# They run here and they fail the build.
name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # Tests come before the gates because the gates' own tests are here: they plant a
      # violation in a fixture and assert each gate reports it, and they hand the runner a
      # gate that must fail. A gate that has stopped matching looks exactly like a clean
      # tree, so the gate step below proves nothing unless these pass first.
      # site/gates/tests/ exercises the vocabulary gate's image half, which reads the text
      # inside published screenshots and needs an OCR engine. Without one those tests skip
      # with the reason rather than failing, and the engine is installed here so that they
      # run somewhere rather than skipping everywhere — the same shape as the container
      # tests, and the same trap CLAUDE.md records: what skips locally must run in CI, or
      # it is untested. A published image is the one place a leaked path or hostname is
      # invisible to every other check in this workflow.
      - name: Install the OCR engine the vocabulary gate's tests need
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr

      - name: Tests
        run: uv run pytest

      # One step, not seven. The gates are listed in scripts/gates.registry and the runner
      # reads that list, so the build and a contributor's terminal run the same set. A
      # second copy of the list here would be a copy that could fall behind, which is
      # exactly the failure a gate is supposed to prevent.
      - name: Gates (Constitution I, II, III, IV, V)
        run: ./scripts/gates.sh

  # The site's own publication gates, reported and not enforced (015 T045).
  #
  # A separate job for the reason the client is one: mkdocs is deliberately outside the uv
  # workspace (ADR-0010), so this needs its own pinned environment and a failure here should
  # be told apart from a Python or a client failure at a glance.
  #
  # **Report-only, and that is the whole point of the task.** These gates already run in
  # `pages.yml`, where they block the push to gh-pages — but `pages.yml` triggers on a push
  # to main and deliberately has no `pull_request` trigger (015 T012), because a feature
  # branch that published would make the public site follow unmerged work. The consequence
  # was that a contributor first learned of a site fault on the publishing run *after* the
  # merge, with the branch already gone. This job closes that gap without reopening the one
  # T012 closed: it reads the same tree with the same gates and never publishes anything.
  #
  # **Report-only is not `continue-on-error`, and that cost a round to find out.** With
  # `continue-on-error: true` the gate step ran, found the planted violation, exited 1 — and
  # GitHub reported the step's *conclusion* as success, because that is what the flag is for.
  # The checks list showed this job green with four findings in its log. A contributor sees a
  # green tick, which is worse than not running the gates at all: it is a check that has been
  # seen to pass while failing.
  #
  # So the steps below report deliberately instead. Each runs its command, and on failure
  # writes the output into the job summary and emits a `::warning::` annotation, both of which
  # surface on the pull request without a red cross, and then exits 0 of its own accord.
  # Nothing here can block a merge, and nothing here can hide a finding either.
  #
  # Making these blocking is a separate decision from running them and is not this task's to
  # take: the gates enforce PR-01 at publication, and `pages.yml` still enforces them there.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: site/requirements.txt

      # The same pinned set `pages.yml` installs, so a contributor, this job and the
      # publishing run resolve one toolchain rather than three that happen to agree.
      - name: Install the pinned site tooling
        run: python -m pip install -r site/requirements.txt

      # The vocabulary gate reads the text inside published images. Without an engine it
      # exits 2 — "could not run" — which the runner reports as its own outcome rather than
      # as a pass. In a report-only job that would be a warning nobody could act on, so the
      # engine is installed and the report means something.
      - name: Install the OCR engine the vocabulary gate needs
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr

      # --strict fails on a broken internal link, a dangling anchor or a page missing from
      # the navigation. Reported rather than enforced, like the gates below. A build that
      # fails leaves no site/build, and the next step then reports "could not run" rather
      # than clean — which is the outcome that says this run proved nothing.
      - name: Report — the site builds under --strict
        run: |
          set -uo pipefail
          report="$(mktemp)"
          if mkdocs build --strict --config-file site/mkdocs.yml >"$report" 2>&1; then
            cat "$report"
            exit 0
          fi
          cat "$report"
          {
            echo "### The site does not build under \`--strict\`"
            echo
            echo "Report-only: this does not block the pull request. It *does* stop"
            echo "publication after merge, because \`pages.yml\` runs the same command."
            echo
            echo '```'
            cat "$report"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          echo "::warning title=Site build::mkdocs build --strict failed; see the job summary"
          exit 0

      # 015 T024. The link-integrity property belongs to `mkdocs build --strict` above,
      # and a second link checker would be a second authority over it. What was missing was
      # evidence that --strict rejects anything at all: a `validation:` block relaxed to
      # `ignore` would leave every build green with broken links published. These tests
      # build a control site carrying one fault per validation rule and expect a refusal
      # naming each, then build it repaired and expect success.
      #
      # They live here rather than in the `checks` job because mkdocs is outside the uv
      # workspace (ADR-0010), so under `uv run pytest` they skip — loudly, with the reason.
      # This is the environment that has mkdocs, so this is where they run for real.
      - name: Report — --strict still rejects a broken internal link
        run: |
          set -uo pipefail
          python -m pip install pytest
          report="$(mktemp)"
          if python -m pytest site/gates/tests/test_link_validation.py -q >"$report" 2>&1; then
            cat "$report"
            exit 0
          fi
          cat "$report"
          {
            echo "### Link validation is no longer proven"
            echo
            echo "Report-only: this does not block the pull request. It means either that"
            echo "\`--strict\` has stopped rejecting the planted faults, or that the"
            echo "fixture's \`validation:\` block no longer matches \`site/mkdocs.yml\`."
            echo
            echo '```'
            cat "$report"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          echo "::warning title=Link validation::the control did not behave; see the job summary"
          exit 0

      - name: Report — the site's own publication gates
        run: |
          set -uo pipefail
          report="$(mktemp)"
          if python site/gates/run_gates.py --site site/build >"$report" 2>&1; then
            cat "$report"
            exit 0
          fi
          cat "$report"
          {
            echo "### The site's publication gates report findings"
            echo
            echo "Report-only: this does not block the pull request. These same gates block"
            echo "the push to gh-pages in \`pages.yml\`, so what is below will stop the site"
            echo "publishing after merge unless it is dealt with first."
            echo
            echo '```'
            cat "$report"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          # Annotated from the runner's own closing block, which names the gates that
          # concluded something, rather than by matching finding-shaped lines out of the
          # body. Several gates print scope notes beside a clean result — the glossary gate
          # says which pages it does not hold to the first-use rule, the blog gate lists the
          # entries with a recorded screenshot allowance — and those lines look exactly like
          # findings. Grepping the body annotated thirteen things on a run with four
          # findings, which is how an annotation stops being read.
          #
          # A gate that could not run is annotated too. It is the outcome that proves
          # nothing, and it must not reach a pull request as silence.
          sed -n '/gate(s) ran/,$p' "$report" | sed -n 's/^  \(.*\)$/\1/p' |
            while IFS= read -r gate; do
              echo "::warning title=Site gate::${gate}: see the job summary for what it reported"
            done
          tail -n 1 "$report" | while IFS= read -r verdict; do
            echo "::warning title=Site gates::${verdict}"
          done
          exit 0

  # The client has its own toolchain and its own tests, and they are no less part of the
  # build for being written in a different language. Kept as a separate job so a Python
  # failure and a client failure are told apart at a glance rather than by reading a log.
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      # An action's inputs are not affected by defaults.run.working-directory, so the
      # version has to be found through an explicit path. It is pinned in
      # client/package.json rather than here, so a contributor and the build resolve the
      # same pnpm instead of two that happen to agree today.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      # Feature 016 owns `client/e2e/`, which is type-checked against its own tsconfig
      # because the capture tooling runs in node rather than in a browser and needs node's
      # types, which the client itself deliberately does not have. Appended here rather
      # than folded into the step above so that a capture failure and a client failure are
      # told apart by their step name. The capture *specs* need a browser and a running
      # client and are in `.github/workflows/capture.yml`; this step needs neither.
      - name: Capture tooling types
        run: pnpm run typecheck:capture
