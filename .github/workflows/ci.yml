# The constitution's quality gates, run on every change.
#
# Gates 3 to 7 of the constitution's Development Workflow are the ones that cannot be
# checked by reading a diff: they enforce properties that hold across the whole tree.
# They run here and they fail the build.
name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the workspace
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      # Tests come before the gates because the gates' own tests are here: they plant a
      # violation in a fixture and assert each gate reports it, and they hand the runner a
      # gate that must fail. A gate that has stopped matching looks exactly like a clean
      # tree, so the gate step below proves nothing unless these pass first.
      # site/gates/tests/ exercises the vocabulary gate's image half, which reads the text
      # inside published screenshots and needs an OCR engine. Without one those tests skip
      # with the reason rather than failing, and the engine is installed here so that they
      # run somewhere rather than skipping everywhere — the same shape as the container
      # tests, and the same trap CLAUDE.md records: what skips locally must run in CI, or
      # it is untested. A published image is the one place a leaked path or hostname is
      # invisible to every other check in this workflow.
      - name: Install the OCR engine the vocabulary gate's tests need
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr

      - name: Tests
        run: uv run pytest

      # One step, not seven. The gates are listed in scripts/gates.registry and the runner
      # reads that list, so the build and a contributor's terminal run the same set. A
      # second copy of the list here would be a copy that could fall behind, which is
      # exactly the failure a gate is supposed to prevent.
      - name: Gates (Constitution I, II, III, IV, V)
        run: ./scripts/gates.sh

  # The site's own publication gates, reported and not enforced (015 T045).
  #
  # A separate job for the reason the client is one: mkdocs is deliberately outside the uv
  # workspace (ADR-0010), so this needs its own pinned environment and a failure here should
  # be told apart from a Python or a client failure at a glance.
  #
  # **Report-only, and that is the whole point of the task.** These gates already run in
  # `pages.yml`, where they block the push to gh-pages — but `pages.yml` triggers on a push
  # to main and deliberately has no `pull_request` trigger (015 T012), because a feature
  # branch that published would make the public site follow unmerged work. The consequence
  # was that a contributor first learned of a site fault on the publishing run *after* the
  # merge, with the branch already gone. This job closes that gap without reopening the one
  # T012 closed: it reads the same tree with the same gates and never publishes anything.
  #
  # `continue-on-error` is on both steps rather than on the job, so a failure is annotated
  # against the step that produced it and stays visible in the checks list, while the
  # required status of this workflow is unchanged. Making these blocking is a separate
  # decision from running them, and it is not this task's to take: the gates enforce PR-01
  # at publication, and the publication path still enforces them.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: site/requirements.txt

      # The same pinned set `pages.yml` installs, so a contributor, this job and the
      # publishing run resolve one toolchain rather than three that happen to agree.
      - name: Install the pinned site tooling
        run: python -m pip install -r site/requirements.txt

      # The vocabulary gate reads the text inside published images. Without an engine it
      # exits 2 — "could not run" — which the runner reports as its own outcome rather than
      # as a pass. In a report-only job that would be a warning nobody could act on, so the
      # engine is installed and the report means something.
      - name: Install the OCR engine the vocabulary gate needs
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr

      # --strict fails on a broken internal link, a dangling anchor or a page missing from
      # the navigation. Report-only here like the gates below: this job adds no blocking
      # check, and an unbuilt tree makes the next step report "could not run" rather than
      # pass, which is the outcome that says this run proved nothing.
      - name: Build the site
        continue-on-error: true
        run: mkdocs build --strict --config-file site/mkdocs.yml

      - name: Report — the site's own publication gates
        continue-on-error: true
        run: python site/gates/run_gates.py --site site/build

  # The client has its own toolchain and its own tests, and they are no less part of the
  # build for being written in a different language. Kept as a separate job so a Python
  # failure and a client failure are told apart at a glance rather than by reading a log.
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      # An action's inputs are not affected by defaults.run.working-directory, so the
      # version has to be found through an explicit path. It is pinned in
      # client/package.json rather than here, so a contributor and the build resolve the
      # same pnpm instead of two that happen to agree today.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      # Feature 016 owns `client/e2e/`, which is type-checked against its own tsconfig
      # because the capture tooling runs in node rather than in a browser and needs node's
      # types, which the client itself deliberately does not have. Appended here rather
      # than folded into the step above so that a capture failure and a client failure are
      # told apart by their step name. The capture *specs* need a browser and a running
      # client and are in `.github/workflows/capture.yml`; this step needs neither.
      - name: Capture tooling types
        run: pnpm run typecheck:capture
