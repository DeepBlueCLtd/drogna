# Per-branch instances of the app, published into the gh-pages estate (SRD-v2
# NFR-04, D16, D18). The estate GROWS: each deployment replaces only its own
# instances/<branch-slug>/ subtree and touches nothing else, so review instances stay
# addressable after their PR completes and the V1 site remains published beside them.
# A wholesale rebuild of the estate is exactly what D18 forbids.
name: Instances

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write
  # The instance is of no use to a reviewer who cannot find it, so the job also
  # writes the address onto the pull request open on this branch.
  pull-requests: write

# Serialised, never cancelled: two estate pushes racing would drop one instance.
concurrency:
  group: gh-pages-estate
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -C app run build
        env:
          DROGNA_REVISION: ${{ github.sha }}

      - name: Check out the estate
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: estate

      - name: Place this branch's instance
        run: |
          slug="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          echo "slug=${slug}" >> "$GITHUB_ENV"
          rm -rf "estate/instances/${slug}"
          mkdir -p "estate/instances/${slug}"
          cp -r app/dist/. "estate/instances/${slug}/"

      - name: Push, additively
        run: |
          cd estate
          git config user.name "drogna-instances"
          git config user.email "actions@users.noreply.github.com"
          git add "instances/${slug}"
          if git diff --cached --quiet; then
            echo "instance unchanged; nothing to push"
            exit 0
          fi
          git commit -m "instance: ${slug} @ ${GITHUB_SHA}"
          for delay in 2 4 8 16; do
            if git push; then exit 0; fi
            git pull --rebase origin gh-pages
            sleep "$delay"
          done
          git push

      # A reviewer should not have to reconstruct the address of the thing under
      # review. One comment per pull request, rewritten in place on every push, so a
      # branch pushed ten times leaves one link rather than ten. The view list is read
      # from the configuration the shell itself reads (Constitution IV): a list typed
      # in here would be a copy that could fall behind. Missing on a push with no pull
      # request open — which is the normal case for main — is not a failure.
      - name: Link the instance from the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number="$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number')"
          if [ -z "${number}" ]; then
            echo "no pull request open on ${GITHUB_REF_NAME}; nothing to link"
            exit 0
          fi
          url="https://deepbluecltd.github.io/drogna/instances/${slug}/"
          # Joined by jq, not by paste: paste -d takes a list of single characters and
          # cycles through the bytes of a multi-byte one, which turned the separator
          # into mojibake when this was first run.
          views="$(jq -r --arg url "${url}" \
            '[.shell.views[] | "[\(.label)](\($url)#/view/\(.id))"] | join(" · ")' \
            app/config/run.json)"
          body="$(printf '%s\n' \
            '<!-- drogna-instance -->' \
            "### This branch, running: <${url}>" \
            '' \
            "${views}" \
            '' \
            "Built from \`${GITHUB_SHA}\`, and replaced in place by every further push to this branch. Synthetic throughout, as the header says.")"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" --paginate \
            --jq 'map(select(.body | startswith("<!-- drogna-instance -->"))) | .[0].id // empty')"
          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="${body}" > /dev/null
            echo "instance link updated on #${number}: ${url}"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" -f body="${body}" > /dev/null
            echo "instance link posted on #${number}: ${url}"
          fi

      # D17: the author is told when something is ready to look at. The topic is a CI
      # secret (PR-01): with no secret configured, this step says so and does nothing.
      - name: ntfy the author
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        run: |
          if [ -z "${NTFY_TOPIC}" ]; then
            echo "no NTFY_TOPIC secret configured; skipping the notice"
            exit 0
          fi
          url="https://deepbluecltd.github.io/drogna/instances/${slug}/"
          curl -fsS -d "drogna instance updated: ${url}#/view/system" \
            "${NTFY_SERVER:-https://ntfy.sh}/${NTFY_TOPIC}" > /dev/null
          echo "notice sent"
