# Per-branch instances of the app, published into the gh-pages estate (SRD-v2
# NFR-04, D16, D18). The estate GROWS: each deployment replaces only its own
# instances/<branch-slug>/ subtree and touches nothing else, so review instances stay
# addressable after their PR completes and the V1 site remains published beside them.
# A wholesale rebuild of the estate is exactly what D18 forbids.
name: Instances

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write
  # The instance is of no use to a reviewer who cannot find it, so the job also
  # writes the address onto the pull request open on this branch.
  pull-requests: write

# Grouped per branch, and deliberately NOT shared with the site workflow. GitHub holds
# at most ONE queued run per concurrency group: `cancel-in-progress: false` protects the
# run that is already going, and the next arrival evicts and CANCELS the one waiting
# behind it. A group shared across workflows therefore drops runs rather than
# serialising them — which is how the V2 site publication was lost, cancelled four
# seconds after it queued behind an instance deployment. Within one branch the eviction
# is harmless and wanted: the run that displaces a waiting one carries the newer build.
# Estate writers now race instead, and the push step below resolves that by re-placing
# on the winner's state.
concurrency:
  group: gh-pages-instances-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -C app run build
        env:
          DROGNA_REVISION: ${{ github.sha }}

      - name: Check out the estate
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: estate

      - name: Place this branch's instance and push, additively
        run: |
          set -euo pipefail
          slug="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          echo "slug=${slug}" >> "$GITHUB_ENV"

          # Placement is a function of this build and whatever the estate holds right
          # now, so a losing attempt re-does it on the winner's state rather than
          # rebasing onto it. Both workflows regenerate instances/index.html, and
          # rebasing one generated file onto another run's version of it conflicts,
          # where re-deriving it from the estate just fetched cannot.
          place() {
            rm -rf "estate/instances/${slug}"
            mkdir -p "estate/instances/${slug}"
            cp -r app/dist/. "estate/instances/${slug}/"
            # What this instance was built from, written beside it. An instance outlives
            # the branch it came from — that is the point of retaining it once the pull
            # request completes — so its provenance has to travel with it rather than be
            # looked up later against a ref that may be gone.
            printf '{\n  "ref": "%s",\n  "sha": "%s",\n  "built": "%s"\n}\n' \
              "${GITHUB_REF_NAME}" "${GITHUB_SHA}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              > "estate/instances/${slug}/instance.json"
            # The index is what makes the instances a place rather than a set of URLs
            # somebody has to already know (NFR-04). It is regenerated from what the
            # estate holds, so it lists retired branches' instances too, for as long as
            # the estate keeps them.
            pnpm run estate:index estate
          }

          git -C estate config user.name "drogna-instances"
          git -C estate config user.email "actions@users.noreply.github.com"

          for delay in 2 4 8 16; do
            place
            git -C estate add "instances/${slug}" instances/index.html
            if git -C estate diff --cached --quiet; then
              echo "instance unchanged; nothing to push"
              exit 0
            fi
            git -C estate commit -m "instance: ${slug} @ ${GITHUB_SHA}"
            if git -C estate push; then exit 0; fi
            echo "another writer moved the estate; taking its state and placing again"
            git -C estate fetch origin gh-pages
            git -C estate reset --hard origin/gh-pages
            sleep "${delay}"
          done
          echo "could not push the instance into the estate after four attempts" >&2
          exit 1

      # A reviewer should not have to reconstruct the address of the thing under
      # review. One comment per pull request, rewritten in place on every push, so a
      # branch pushed ten times leaves one link rather than ten. The view list is read
      # from the configuration the shell itself reads (Constitution IV): a list typed
      # in here would be a copy that could fall behind. Missing on a push with no pull
      # request open — which is the normal case for main — is not a failure.
      - name: Link the instance from the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number="$(gh pr list --head "${GITHUB_REF_NAME}" --state open --json number --jq '.[0].number')"
          if [ -z "${number}" ]; then
            echo "no pull request open on ${GITHUB_REF_NAME}; nothing to link"
            exit 0
          fi
          url="https://deepbluecltd.github.io/drogna/instances/${slug}/"
          # Joined by jq, not by paste: paste -d takes a list of single characters and
          # cycles through the bytes of a multi-byte one, which turned the separator
          # into mojibake when this was first run.
          views="$(jq -r --arg url "${url}" \
            '[.shell.views[] | "[\(.label)](\($url)#/view/\(.id))"] | join(" · ")' \
            app/config/run.json)"
          body="$(printf '%s\n' \
            '<!-- drogna-instance -->' \
            "### This branch, running: <${url}>" \
            '' \
            "${views}" \
            '' \
            "Built from \`${GITHUB_SHA}\`, and replaced in place by every further push to this branch. Synthetic throughout, as the header says.")"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" --paginate \
            --jq 'map(select(.body | startswith("<!-- drogna-instance -->"))) | .[0].id // empty')"
          if [ -n "${existing}" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -f body="${body}" > /dev/null
            echo "instance link updated on #${number}: ${url}"
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" -f body="${body}" > /dev/null
            echo "instance link posted on #${number}: ${url}"
          fi

      # D17: the author is told when something is ready to look at. The topic is a CI
      # secret (PR-01): with no secret configured, this step says so and does nothing.
      - name: ntfy the author
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        run: |
          if [ -z "${NTFY_TOPIC}" ]; then
            echo "no NTFY_TOPIC secret configured; skipping the notice"
            exit 0
          fi
          url="https://deepbluecltd.github.io/drogna/instances/${slug}/"
          curl -fsS -d "drogna instance updated: ${url}#/view/system" \
            "${NTFY_SERVER:-https://ntfy.sh}/${NTFY_TOPIC}" > /dev/null
          echo "notice sent"
