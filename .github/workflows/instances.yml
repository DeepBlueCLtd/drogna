# Per-branch instances of the app, published into the gh-pages estate (SRD-v2
# NFR-04, D16, D18). The estate GROWS: each deployment replaces only its own
# instances/<branch-slug>/ subtree and touches nothing else, so review instances stay
# addressable after their PR completes and the V1 site remains published beside them.
# A wholesale rebuild of the estate is exactly what D18 forbids.
name: Instances

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: write
  # The preview comment below. Nothing else here writes to a pull request.
  pull-requests: write

# Serialised, never cancelled: two estate pushes racing would drop one instance.
concurrency:
  group: gh-pages-estate
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -C app run build
        env:
          DROGNA_REVISION: ${{ github.sha }}

      - name: Check out the estate
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: estate

      - name: Place this branch's instance
        run: |
          slug="$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          echo "slug=${slug}" >> "$GITHUB_ENV"
          rm -rf "estate/instances/${slug}"
          mkdir -p "estate/instances/${slug}"
          cp -r app/dist/. "estate/instances/${slug}/"
          # What this instance was built from, written beside it. An instance outlives
          # the branch it came from — that is the point of retaining it once the pull
          # request completes — so its provenance has to travel with it rather than be
          # looked up later against a ref that may be gone.
          cat > "estate/instances/${slug}/instance.json" <<JSON
          {
            "ref": "${GITHUB_REF_NAME}",
            "sha": "${GITHUB_SHA}",
            "built": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON

      # The index is what makes the instances a place rather than a set of URLs somebody
      # has to already know (NFR-04). It is regenerated from what the estate holds, so it
      # lists retired branches' instances too, for as long as the estate keeps them.
      - name: Regenerate the instance index
        run: pnpm run estate:index estate

      - name: Push, additively
        run: |
          cd estate
          git config user.name "drogna-instances"
          git config user.email "actions@users.noreply.github.com"
          git add "instances/${slug}" instances/index.html
          if git diff --cached --quiet; then
            echo "instance unchanged; nothing to push"
            exit 0
          fi
          git commit -m "instance: ${slug} @ ${GITHUB_SHA}"
          for delay in 2 4 8 16; do
            if git push; then exit 0; fi
            git pull --rebase origin gh-pages
            sleep "$delay"
          done
          git push

      # The instance is published and addressable, and until now the only person told
      # was whoever holds the ntfy topic. A reviewer arriving at the pull request had no
      # way to reach the thing under review without knowing the estate's URL scheme by
      # heart, which is exactly what NFR-04 says the estate exists not to require.
      #
      # One comment per pull request, rewritten in place on every push. Appending would
      # bury the review under a stack of near-identical links, and the only one that is
      # ever true is the newest.
      - name: Comment the preview link on the pull request
        if: github.ref_name != 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- drogna-instance-preview -->';
            // Written to GITHUB_ENV by the placement step, and deliberately not
            // re-derived here: two definitions of the slug could disagree, and the one
            // that matters is the directory the instance was actually written to.
            const slug = process.env.slug;
            if (!slug) {
              core.setFailed('the instance slug is unset — a link to instances// helps nobody');
              return;
            }
            const url = `https://deepbluecltd.github.io/drogna/instances/${slug}/`;
            const { owner, repo } = context.repo;
            const pulls = await github.rest.pulls.list({
              owner, repo, state: 'open', head: `${owner}:${context.ref.replace('refs/heads/', '')}`,
            });
            if (pulls.data.length === 0) {
              core.info('no open pull request for this branch; nothing to comment on');
              return;
            }
            const body = [
              marker,
              `**Preview instance:** ${url}`,
              '',
              `Built from \`${context.sha.slice(0, 7)}\`. The whole harness runs in the page — the`,
              'clock is a component, the tabs are live, and nothing is mocked below the seam.',
              '',
              'Deep links: ' + [
                `[Intro](${url}#/view/intro)`,
                `[Background](${url}#/view/background)`,
                `[System](${url}#/view/system)`,
                `[Holdings](${url}#/view/holdings)`,
                `[Map](${url}#/view/map)`,
                `[Messages](${url}#/view/messages)`,
              ].join(' · '),
              '',
              'This comment is rewritten on every push to the branch, so the link above is',
              'always the newest build.',
            ].join('\n');
            for (const pull of pulls.data) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pull.number,
              });
              const existing = comments.find((comment) => comment.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                core.info(`updated the preview comment on #${pull.number}`);
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pull.number, body });
                core.info(`posted the preview comment on #${pull.number}`);
              }
            }

      # D17: the author is told when something is ready to look at. The topic is a CI
      # secret (PR-01): with no secret configured, this step says so and does nothing.
      - name: ntfy the author
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        run: |
          if [ -z "${NTFY_TOPIC}" ]; then
            echo "no NTFY_TOPIC secret configured; skipping the notice"
            exit 0
          fi
          url="https://deepbluecltd.github.io/drogna/instances/${slug}/"
          curl -fsS -d "drogna instance updated: ${url}#/view/system" \
            "${NTFY_SERVER:-https://ntfy.sh}/${NTFY_TOPIC}" > /dev/null
          echo "notice sent"
