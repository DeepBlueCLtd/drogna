# Publishes the site to the gh-pages branch.
#
# gh-pages is machine-owned. Nothing is hand-edited there; anything that is will
# be overwritten by the next run of this workflow.
#
# Fork pull requests cannot publish, because there is no pull_request trigger at
# all. Only pushes to branches in this repository, and manual dispatch, run it.
name: Publish site

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Feature branches deliberately do NOT publish. They did once, so that the
# pipeline could be verified before a merge rather than after one, and it was:
# the first run replaced the auto-generated Jekyll rendering of the README.
# Publishing from a feature branch means the public site follows unmerged work,
# so a reader can see a claim about drogna that no longer holds by the time they
# act on it. Verify a site change with `mkdocs build --strict` locally, or with
# workflow_dispatch on a branch when the published output itself is in question.

permissions:
  # Writing the gh-pages branch is the only permission this job needs.
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # ghp-import commits onto gh-pages, so the branch history is needed.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install pinned site tooling
        run: python -m pip install -r site/requirements.txt

      - name: Build the site
        # The same command a person runs locally. --strict turns every warning
        # into a failure: a broken internal link, a dangling anchor or a page
        # missing from the navigation stops the publication.
        run: mkdocs build --strict --config-file site/mkdocs.yml

      - name: Gate — no external sub-resources
        # PR-01: the published site must fetch nothing from another origin.
        run: python site/tools/check_no_external_resources.py site/build

      # The vocabulary gate reads the text inside published images, which needs an OCR
      # engine. Without one it exits 2 — "could not run" — and the runner treats that as a
      # failure rather than a pass, so this step is what stands between a real image scan
      # and a loud refusal to publish. It is deliberately not a silent skip: an image is
      # the one place a leaked hostname or path is invisible to every other check here.
      - name: Install the OCR engine the vocabulary gate needs
        run: sudo apt-get update -qq && sudo apt-get install -y tesseract-ocr

      # FR-004: one entry point, run before anything reaches gh-pages, reporting every
      # failure rather than stopping at the first. It discovers site/gates/check_*.py and
      # names none of them, so a feature adds a gate by adding a file.
      #
      # This is registered here rather than in scripts/gates.registry on purpose. Every
      # gate below runs over the *built* site, and mkdocs is deliberately outside the uv
      # workspace (ADR-0010), so ./scripts/gates.sh would go red in any checkout that had
      # not run a build first — which is every fresh checkout. FR-004 asks for these gates
      # to run before a push to gh-pages, and this is that point.
      - name: Gate — the site's own publication gates
        run: python site/gates/run_gates.py --site site/build

      # The two steps that used to sit here — a grep of the built index.html for the
      # FR-01 statement, and a grep of index.html and robots.txt for the indexing refusal
      # — are gone, because both are now gates that the step above discovers:
      # site/gates/check_landing_page.py and site/gates/check_indexing.py. Keeping the
      # greps as well would be two authorities over one property, and the weaker of the
      # two is the one somebody would eventually satisfy.
      #
      # Each gate is stronger than the grep it replaces, in the way that mattered:
      #
      #   - the landing-page gate checks the statement is *first*, which the grep could
      #     not — it matched three phrases anywhere in the file, so moving the statement
      #     below a section of prose passed. FR-01's clause is "so no viewer mistakes it
      #     for a candidate system", and a disclaimer three screens down is not that.
      #   - the indexing gate reads every built page rather than index.html. The meta tag
      #     reaches pages through one theme override, so the way it fails is by ceasing to
      #     apply *somewhere*, which a check of the landing page alone cannot see.
      #
      # Both carry a committed control under site/gates/fixtures/ on which the old grep
      # passes and the gate reports, and site/gates/tests/ asserts exactly that pairing.

      - name: Disable Jekyll processing
        # GitHub Pages runs Jekyll over a branch-served site by default, and
        # Jekyll strips directories whose names begin with an underscore —
        # which is several of the ones the theme emits. .nojekyll turns that off.
        run: |
          set -euo pipefail
          touch site/build/.nojekyll
          test -f site/build/.nojekyll

      - name: Deploy to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # ghp-import pushes the directory that the gates just passed, byte for
        # byte. `mkdocs gh-deploy` would rebuild first, which would mean the
        # artefact that was checked is not the artefact that is published.
        #   -n add .nojekyll   -p push   -f force   -m message
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ghp-import --no-jekyll --push --force \
            --branch gh-pages \
            --message "Publish site from ${GITHUB_SHA} [skip ci]" \
            site/build

      - name: Verify .nojekyll reached the published branch
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git ls-tree --name-only origin/gh-pages | grep -qx '.nojekyll'
          echo ".nojekyll is present in the published tree."
