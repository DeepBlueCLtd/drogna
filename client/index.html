<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>drogna — component shell</title>
    <meta
      name="description"
      content="drogna is a learning harness with synthetic data and deliberately fake numerics. It is not a candidate system."
    />
  </head>
  <body>
    <!--
      The honesty statement is served in the initial payload, before any script runs, so
      a viewer reads it whether or not the bundle loads (FR-01, SC-009). React takes over
      this element and renders the same words from ui/HonestyBanner.tsx; a test compares
      the two so they cannot drift apart.
    -->
    <div id="honesty">
      <p class="honesty" data-testid="honesty-statement">
        drogna is a learning harness. Its data is synthetic and its numerics are deliberately
        fake. It is not a candidate system, and nothing shown here is evidence about any real
        environment.
      </p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
