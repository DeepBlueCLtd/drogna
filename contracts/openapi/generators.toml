# The generator manifest: which tool, at which version, turns which master into which
# artefact. Constitution III makes the generated trees part of the build, so the tools
# that write them are part of the contract: `scripts/check_types_drift.sh` compares the
# committed output byte for byte, and a generator that changed version behind our backs
# would fail that comparison with a diff nobody's change caused.
#
# Every version here is checked against what is actually installed before generation
# starts. A mismatch stops the run with a message naming both versions, rather than
# rewriting the tree in a dialect the committed output was not written in.
#
# The specification records the generator choice as an assumption. This file is where the
# assumption is settled, and it settles it differently from the specification's guess in
# one place — the TypeScript half — for a reason given under [[tool]] below.

[chain]
generate = "scripts/generate_types.sh"
check = "scripts/check_types_drift.sh"
refresh = "scripts/refresh_query_layer_spec.sh"

# ---------------------------------------------------------------------------------
# Tools
# ---------------------------------------------------------------------------------

[[tool]]
name = "datamodel-code-generator"
command = "datamodel-codegen"
version = "0.75.1"
role = "JSON Schema to Python (Pydantic v2 models)"
# Chosen because it is the only widely used JSON Schema to Python generator that keeps
# constraints (minimum, pattern, enum) and descriptions in the model rather than dropping
# them at the door, and because in directory mode it emits one module per master with
# real cross-module imports — so a shape shared by two masters is defined once and
# imported, which is what NFR-02 asks for and what a per-file invocation cannot give.
#
# Directory mode is also why generation runs against a bundle rather than against
# `contracts/schemas/` directly: the bundle is where external references are rewritten to
# bundle-relative form and where the messages/config split is imposed.
#
# The tool is installed without its `[http]` extra. That is deliberate and load-bearing:
# an unresolvable reference then fails with "install the http extra" instead of quietly
# fetching a document over the network, which FR-016 forbids and which would make the
# drift check depend on the internet.

[[tool]]
name = "black"
version = "26.5.1"
role = "formatter invoked by datamodel-code-generator"
# Formatting is part of the bytes being compared, so the formatter is pinned like a
# generator. `--formatters black isort` is used in preference to the ruff formatter
# because datamodel-code-generator shells out to whichever `ruff` is on PATH, which is
# not necessarily the workspace's; black and isort are its own pinned dependencies,
# resolved by `uv.lock` and installed by `uv sync --frozen`, so every machine formats
# identically. The builtin formatter is dependency-free but wraps annotations in
# parentheses and leaves 300-character lines, which makes a review diff unreadable.

[[tool]]
name = "isort"
version = "8.0.1"
role = "import ordering, invoked by datamodel-code-generator"

[[tool]]
name = "drogna-schema-to-typescript"
implementation = "scripts/schema_to_typescript.py"
version = "1.0"
role = "JSON Schema to TypeScript"
# The specification assumed `json-schema-to-typescript` and `openapi-typescript` here.
# Both are good tools and both are Node packages, and that is the problem: FR-009 says
# the drift check needs no network fetch and no service, and SC-007 says it passes with
# networking disabled. A Node generator makes the gate depend on `pnpm install` — a
# network fetch — inside the Python job that runs every other gate, or else on a second
# job that has half the chain in it. Neither is a gate anyone would trust.
#
# So the TypeScript half is a small emitter in this repository, over the JSON Schema
# subset the masters actually use. It fails loudly on any construct it does not
# understand rather than emitting something plausible, which is the property that
# matters: an emitter that guesses is worse than no emitter, because the wrong type
# compiles.
#
# This is a trade. What is given up is a generator with more users than us; what is
# bought is a check that runs anywhere Python runs, with nothing to install and nothing
# to reach. If the OpenAPI half ever needs more than this emitter can do, the honest
# move is `openapi-typescript` invoked from the client's own toolchain, with the drift
# check split in two and both halves run in CI — not a Python-only gate that quietly
# stops examining the TypeScript.

# ---------------------------------------------------------------------------------
# What is generated from what
# ---------------------------------------------------------------------------------

[python]
tool = "datamodel-code-generator"
target = "libs/harness_types/src/harness_types"
# Passed to datamodel-codegen. Recorded here rather than in the script so that the whole
# reason a generated file looks the way it does is in one file.
#
#   --disable-timestamp        a timestamp in the output makes every run a diff
#   --field-constraints        Field(ge=0) rather than the deprecated conint(ge=0)
#   --use-standard-collections  list[str], not typing.List[str]
#   --use-union-operator       X | None, not typing.Optional[X]
#   --target-python-version    the workspace's Python, so StrEnum is available
options = [
    "--input-file-type", "jsonschema",
    "--output-model-type", "pydantic_v2.BaseModel",
    "--target-python-version", "3.11",
    "--disable-timestamp",
    "--field-constraints",
    "--use-standard-collections",
    "--use-union-operator",
    "--formatters", "black", "isort",
]

[typescript]
tool = "drogna-schema-to-typescript"
target = "client/src/generated"

# The bundle: masters copied to a scratch directory, external references rewritten to
# bundle-relative form, and the two subdirectories imposed. It is a build artefact and is
# never committed; the documents under `contracts/` remain authoritative.
[bundle]
config_prefix = "config."
config_directory = "config"
message_directory = "messages"

# ---------------------------------------------------------------------------------
# Schema copies
# ---------------------------------------------------------------------------------
#
# A component in a container validates its configuration before any other I/O and has no
# `contracts/` directory to hand, so the schemas it needs travel inside its package. Those
# copies used to be made by hand; they are an output of this chain now, and the tests that
# assert each copy is byte-identical to its master are unchanged — they simply cannot fail
# any more without the drift check failing first.
#
# `libs/harness_core/src/harness_core/schemas/heartbeat.schema.json` was left out of this
# list when the chain was written, on the ground that reconciling a diverged copy changes
# what harness_core validates and is the owning feature's call rather than this chain's to
# make silently. That was the right instinct and the wrong outcome, so the omission was
# reviewed and reversed.
#
# The copy did not merely lag. It said liveness is judged in simulation time, which is
# what ADR-0006 overturned: cadence and liveness windows are real time, and the simulation
# time a heartbeat carries is payload rather than schedule. It also lacked the two optional
# declarations the master gained for that decision, while declaring
# `additionalProperties: false` — and the client already reads both fields. A clock service
# publishing the heartbeat ADR-0006 describes, to a client that expects it, would have been
# rejected by harness_core's own validation. The reconciliation is not housekeeping; it is
# the repair of a live contradiction between a component and a ratified decision.
[[copy]]
source = "contracts/schemas/clock.schema.json"
target = "libs/harness_core/src/harness_core/schemas/clock.schema.json"

[[copy]]
source = "contracts/schemas/heartbeat.schema.json"
target = "libs/harness_core/src/harness_core/schemas/heartbeat.schema.json"

[[copy]]
source = "contracts/schemas/config.common.schema.json"
target = "services/env_generator/src/harness_env_generator/schemas/config.common.schema.json"

[[copy]]
source = "contracts/schemas/config.env_generator.schema.json"
target = "services/env_generator/src/harness_env_generator/schemas/config.env_generator.schema.json"

[[copy]]
source = "contracts/schemas/manifest.schema.json"
target = "services/env_generator/src/harness_env_generator/schemas/manifest.schema.json"

# The control loop's four services validate their configuration before any other I/O, so
# each carries its own schema and the common sections it references.
[[copy]]
source = "contracts/schemas/config.common.schema.json"
target = "services/monitor/src/harness_monitor/schemas/config.common.schema.json"

[[copy]]
source = "contracts/schemas/config.monitor.schema.json"
target = "services/monitor/src/harness_monitor/schemas/config.monitor.schema.json"

[[copy]]
source = "contracts/schemas/config.common.schema.json"
target = "services/scheduler/src/harness_scheduler/schemas/config.common.schema.json"

[[copy]]
source = "contracts/schemas/config.scheduler.schema.json"
target = "services/scheduler/src/harness_scheduler/schemas/config.scheduler.schema.json"

[[copy]]
source = "contracts/schemas/config.common.schema.json"
target = "services/model_runner/src/harness_model_runner/schemas/config.common.schema.json"

[[copy]]
source = "contracts/schemas/config.model_runner.schema.json"
target = "services/model_runner/src/harness_model_runner/schemas/config.model_runner.schema.json"

[[copy]]
source = "contracts/schemas/config.common.schema.json"
target = "services/publisher/src/harness_publisher/schemas/config.common.schema.json"

[[copy]]
source = "contracts/schemas/config.publisher.schema.json"
target = "services/publisher/src/harness_publisher/schemas/config.publisher.schema.json"

# Not a configuration schema. The publisher validates the run manifest it writes against the
# store's master before that manifest reaches the store, because a manifest the query layer
# would refuse is a run that is published and never catalogued — a failure that surfaces
# three components away from its cause.
[[copy]]
source = "contracts/schemas/coverage-run-manifest.schema.json"
target = "services/publisher/src/harness_publisher/schemas/coverage-run-manifest.schema.json"

# C-01 validates its configuration before it binds a socket, so it carries its own schema
# and the common sections that schema references, like every other component.
[[copy]]
source = "contracts/schemas/config.common.schema.json"
target = "services/clock/src/harness_clock/schemas/config.common.schema.json"

[[copy]]
source = "contracts/schemas/config.clock.schema.json"
target = "services/clock/src/harness_clock/schemas/config.clock.schema.json"

# C-01 also writes the run manifest — it holds the run's identity, so it is the component
# that must validate the document before writing it.
[[copy]]
source = "contracts/schemas/run-manifest.schema.json"
target = "services/clock/src/harness_clock/schemas/run-manifest.schema.json"

# The observation path. Both services validate their configuration before any other I/O,
# so each carries its own schema and the common sections it references. Neither carries a
# copy of the observation message master: both validate messages against the Pydantic model
# generated from it into libs/harness_types, which is the one definition either end holds
# (Constitution III), so the publisher and the single ingestion seam cannot come to
# disagree about what a valid observation is.
[[copy]]
source = "contracts/schemas/config.common.schema.json"
target = "services/sensors/src/harness_sensors/schemas/config.common.schema.json"

[[copy]]
source = "contracts/schemas/config.sensors.schema.json"
target = "services/sensors/src/harness_sensors/schemas/config.sensors.schema.json"

# The sensors' configuration schema references the observed-property enumeration in the
# observation master rather than restating it — the three quantities are defined once
# (ADR-0005) — so the component needs that document to hand to resolve the reference when
# it validates its configuration before any other I/O.
[[copy]]
source = "contracts/schemas/observation.schema.json"
target = "services/sensors/src/harness_sensors/schemas/observation.schema.json"

[[copy]]
source = "contracts/schemas/config.common.schema.json"
target = "services/ingest/src/harness_ingest/schemas/config.common.schema.json"

[[copy]]
source = "contracts/schemas/config.ingest.schema.json"
target = "services/ingest/src/harness_ingest/schemas/config.ingest.schema.json"

# C-16 validates its configuration before it subscribes to anything, so it carries its own
# schema and the common sections that schema references. It carries no copy of the
# telemetry message master: it validates arriving payloads through the model generated
# from that master, which is the one definition every producer on the branch holds.
[[copy]]
source = "contracts/schemas/config.common.schema.json"
target = "services/telemetry/src/harness_telemetry/schemas/config.common.schema.json"

[[copy]]
source = "contracts/schemas/config.telemetry.schema.json"
target = "services/telemetry/src/harness_telemetry/schemas/config.telemetry.schema.json"

# C-07's provisioning script validates its configuration the same way a component does,
# and for the same reason: it writes to a database, and an invalid configuration should
# stop it before it opens a connection rather than part way through a schema.
[[copy]]
source = "contracts/schemas/config.common.schema.json"
target = "stores/features/schemas/config.common.schema.json"

[[copy]]
source = "contracts/schemas/config.features.schema.json"
target = "stores/features/schemas/config.features.schema.json"

# C-15 validates its configuration before it reads a field or subscribes to anything, so it
# carries its own schema and the common sections that schema references. It carries no copy
# of the plan master: it is the sole producer of that shape and it builds every payload
# through the model generated from the master, so there is nothing here for a second
# document to disagree with (Constitution III).
[[copy]]
source = "contracts/schemas/config.common.schema.json"
target = "services/planner/src/harness_planner/schemas/config.common.schema.json"

[[copy]]
source = "contracts/schemas/config.planner.schema.json"
target = "services/planner/src/harness_planner/schemas/config.planner.schema.json"

# C-10 renders the file nginx serves, and it validates its configuration before it renders
# anything: a boundary rendered from a document nobody checked is a boundary nobody has
# read. The container it renders in holds nginx and this directory, and no contracts/, so
# the schema and the common sections it references travel with the renderer.
[[copy]]
source = "contracts/schemas/config.common.schema.json"
target = "proxy/schemas/config.common.schema.json"

[[copy]]
source = "contracts/schemas/config.proxy.schema.json"
target = "proxy/schemas/config.proxy.schema.json"

# C-17 validates its configuration before any other I/O like every other component, so it
# carries its own schema and the common sections that schema references. It also carries
# three message masters, for a reason the other components do not have: the sidecar manifest
# is validated before a bundle counts as staged, the telemetry report is validated before it
# is called a report, and — the one that matters — a receipt is validated against a schema
# this component holds rather than against anything the sender supplies. A document that can
# cause a local file to be deleted is checked against our copy of the contract.
[[copy]]
source = "contracts/schemas/config.common.schema.json"
target = "services/offload/src/harness_offload/schemas/config.common.schema.json"

[[copy]]
source = "contracts/schemas/config.offload.schema.json"
target = "services/offload/src/harness_offload/schemas/config.offload.schema.json"

[[copy]]
source = "contracts/schemas/bundle-manifest.schema.json"
target = "services/offload/src/harness_offload/schemas/bundle-manifest.schema.json"

[[copy]]
source = "contracts/schemas/offload-receipt.schema.json"
target = "services/offload/src/harness_offload/schemas/offload-receipt.schema.json"

[[copy]]
source = "contracts/schemas/offload-telemetry.schema.json"
target = "services/offload/src/harness_offload/schemas/offload-telemetry.schema.json"

# ---------------------------------------------------------------------------------
# The measurement geometry, and why it adds no line to the lists above
# ---------------------------------------------------------------------------------
#
# `contracts/schemas/run-manifest.schema.json` gained an optional `measurement_geometry`
# block: where a run's measurements were taken, and the identification radius and interval
# they are scored on. It is the ground truth the updated-region half of the leakage gate
# scores a change mask against (FR-015, FR-42), and it lives in the manifest because it is
# the same class of thing as the seeds — the record of what the run actually did, which is
# what makes a claim about a release checkable, and which is exactly what a release must not
# contain.
#
# It is two `$defs` inside a master this manifest already accounts for, so the chain needs
# nothing new: the master is discovered by name like every other, and the copy C-01 carries
# — listed above, because C-01 writes the run manifest — picks the block up with the rest of
# the document when this chain rewrites it.
#
# The block is optional, and it is worth saying here why, because a reader meeting the model
# will otherwise assume a generator lost a `required` entry. Two components write a document
# of this shape. C-01 writes the run's own manifest to the run-data volume and holds no
# observations, so what it writes carries no geometry and is complete without one. The
# offload packager writes the copy that travels beside a bundle and does know where the
# measurements were taken, so that copy carries it. A consumer that needs the geometry
# refuses a manifest without it rather than reading the absence as an empty geometry.
#
# No copy is listed for the leakage gate, which is the only consumer today. It is not a
# component in a container: it runs from the checkout with `contracts/` to hand, and it
# validates through the generated model rather than against a schema document at all. A copy
# would be a second thing to keep in step for no reader.

# ---------------------------------------------------------------------------------
# Per-document generator policy (006 T029, T030, T031)
# ---------------------------------------------------------------------------------
#
# Two OpenAPI documents live in this directory now, and they are not the same kind of
# thing. Reading them under one rule is what T031 forbids, and the reason is concrete
# rather than stylistic:
#
#   `harness.openapi.yaml`         OpenAPI 3.1, hand-written here, and authoritative.
#                                  Its schema dialect is JSON Schema 2020-12, which is why
#                                  it can `$ref` a master by file. Every `components/
#                                  schemas` entry must be such a reference, and what is
#                                  generated for it is an alias of the type already
#                                  generated from that master (NFR-02).
#
#   `query-layer.openapi.json`     OpenAPI 3.0.2, emitted by pygeoapi about itself and
#                                  vendored by `scripts/refresh_query_layer_spec.sh`. Its
#                                  dialect is 3.0's own bounded JSON Schema variant — not
#                                  2020-12 — and its `components/schemas` are pygeoapi's,
#                                  stated inline. They cannot reference our masters and
#                                  cannot be made to: hand-editing it would make it the
#                                  approximation NFR-01 exists to remove.
#
# So the documents are never merged and never generated under one policy. `kind` below is
# what the chain branches on, and it is recorded here rather than in the script so that the
# whole reason a generated file looks the way it does stays in one file.
#
# What is generated from a document with paths, whatever its kind, is its **surface**: the
# paths it serves, and for each the methods and operation identifiers it declares. That is
# the operation-level generation this directory's README said the first document with paths
# would extend the chain to, and it is what a client needs from a service contract — a path
# it cannot mistype, and a removed path that becomes a compile error rather than a 404 in
# somebody's browser.
#
# What is deliberately **not** generated from either document is parameters. In the
# vendored document most of them are `$ref`s into OGC's published schema documents on the
# internet: `.../parameters/bbox.yaml`, `z.yaml`, `instanceId.yaml`. FR-016 forbids the
# chain a network fetch and SC-007 requires it to pass with networking disabled, so those
# references cannot be resolved here. The last segment of such a URL looks like the
# parameter's name and very nearly is one — which is exactly the plausible-but-unverified
# guess this whole feature exists to remove. A parameter list is generated when a document
# states its parameters inline, and not before.

[[document]]
path = "contracts/openapi/harness.openapi.yaml"
kind = "authored"
openapi = "3.1"
# `components/schemas` must reference a master; generation emits aliases, never definitions.
schemas = "alias-masters"

[[document]]
path = "contracts/openapi/query-layer.openapi.json"
kind = "vendored"
openapi = "3.0"
emitted_by = "pygeoapi"
refresh = "scripts/refresh_query_layer_spec.sh"
# Its `components/schemas` are the emitter's own, not drogna's boundary shapes, so no model
# is generated from them. All four that pygeoapi emits here — `queryable`, `queryables`,
# `tilematrixsetlink`, `tiles` — describe endpoints this query layer does not serve: there
# is no `/tiles` and no `/queryables` among its nineteen paths. One of them, `tiles`,
# `$ref`s a document on schemas.opengis.net and could not be generated at all without the
# fetch FR-016 forbids. Generating a model nothing serves, from a reference nobody may
# follow, would be three kinds of approximation at once.
schemas = "not-generated"
