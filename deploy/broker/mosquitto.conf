# C-03, the broker. Two namespaces, two listeners, and no anonymous access.
#
# Owned by 007-observation-path. `deploy/compose.yaml` declares the service and mounts this
# directory read-only at the container path the destination configuration names; the
# contents are this feature's, because the access control lists are the substance of FR-14
# and belong beside the components they constrain.
#
# Every value below is container-internal and identical at both destinations — the same
# property that lets one Compose file serve local and droplet. What differs per destination
# is which host address and port the broker is published on, and that is in
# `config/<destination>/deployment.json` under network.publish.broker, not here. Mosquitto
# expands no environment variables in its configuration, so a value that had to differ per
# destination could not live in this file at all; none does.
#
# Read `deploy/broker/README.md` before changing anything here. It says how the credential
# file is produced, what each role may do, and how the two-broker fallback is taken.

# --- persistence -----------------------------------------------------------------------
#
# The data directory is the `broker-data` volume. What survives a restart is retained
# messages and subscription state: nothing a running stack does not produce again within
# its own liveness windows.

persistence true
persistence_location /mosquitto/data/

# --- logging ---------------------------------------------------------------------------
#
# A refused publish or subscribe is logged. That is the whole of FR-004's evidence at the
# broker, and it is why the log types below are enabled rather than left at the default:
# a component that has been quietly denied looks identical to one that has nothing to say.

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
connection_messages true

# --- flow control ------------------------------------------------------------------------
#
# These two numbers decide what backpressure feels like, so they are set deliberately rather
# than left at defaults that were chosen for a different kind of traffic.
#
# max_inflight_messages is how many quality-of-service 1 messages the broker will send a
# client before it has acknowledged them. The ingest client acknowledges a message only once
# the batch containing it has been committed, so this number is the true ceiling on how much
# of a batch can be in the client's hands at once. At the default of 20 a batch bound of 500
# messages could never be reached by count and every batch would flush on its simulation-time
# bound instead — a working system, but one whose configured batch size meant nothing. It is
# set comfortably above the batch bounds in config/<destination>/ingest.json.
#
# max_queued_messages is how many the broker will hold for a client that is not taking them.
# That is the store of last resort when the ingest queue is at its bound, and it is what
# makes backpressure cost latency rather than data. Beyond it the broker drops, and the drop
# is reported on ctl/telemetry rather than discovered later as a hole in the data.

max_inflight_messages 2000
max_queued_messages 100000

# --- identity --------------------------------------------------------------------------
#
# No anonymous client. Credentials are per role — sensor, ingest, control, viewer — rather
# than per client instance, so adding a sensor needs no access control change and gains no
# permission (spec.md, "Sensor credentials are shared or reused across sensors").
#
# `passwd` is produced at deploy time from the role passwords and is never tracked. A
# missing credential file stops the broker rather than opening it: mosquitto refuses to
# start when password_file names a file it cannot read, which is the failure we want.

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# --- listeners ---------------------------------------------------------------------------
#
# Two, carrying the same namespaces under the same access control lists.
#
# 1883 is MQTT over TCP: every component in the stack reaches the broker here, by service
#      name over the internal network.
#
# 9001 is MQTT over WebSockets, and it is the far end of ADR-0008. The browser reaches the
#      control namespace through a WebSocket upgrade location at the reverse proxy, which
#      proxies to this listener. It is deliberately not published to the host: a listener
#      outside the reverse proxy is the option ADR-0008 rejected, and would contradict
#      FR-41's default deny. The proxy reaches it over the internal network.
#
# ADR-0008 also says where the browser is constrained, and it is not here. Path policy at
# the proxy is evaluated once, at the upgrade; the connection then persists carrying
# traffic the proxy does not inspect per message. What a subscriber may receive is settled
# by the access control list in `acl`, and tested at the broker.

listener 1883
protocol mqtt

listener 9001
protocol websockets
