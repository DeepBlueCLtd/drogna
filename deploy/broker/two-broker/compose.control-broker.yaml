# The second broker, as an overlay rather than an edit.
#
#   docker compose --file deploy/compose.yaml \
#                  --file deploy/broker/two-broker/compose.control-broker.yaml \
#                  --env-file deploy/.env up
#
# An overlay because `deploy/compose.yaml` describes the system drogna runs, and the
# two-broker arrangement is a fallback that is documented and demonstrated rather than
# deployed. Adding a permanent second service entry for a broker nothing normally starts
# would make the file describe something that is not the case.
#
# Every value here comes from the same environment file the main configuration reads. The
# one name that is this overlay's own is HARNESS_BROKER_CONTROL_CONFIG_HOST_DIR, which the
# destination sets to this directory; `deploy/broker/README.md` says what to add where.

services:

  control-broker:
    restart: ${HARNESS_RESTART_POLICY}
    profiles: [broker, full]
    image: eclipse-mosquitto:2.0.22@sha256:212f89e1eaeb2c322d6441b64396e3346026674db8fa9c27beac293405c32b3c
    logging:
      driver: ${HARNESS_LOG_DRIVER}
      options:
        max-size: ${HARNESS_LOG_MAX_SIZE}
        max-file: ${HARNESS_LOG_MAX_FILES}
    deploy:
      resources:
        limits:
          memory: ${HARNESS_LIMIT_MEMORY}
          cpus: ${HARNESS_LIMIT_CPUS}
    volumes:
      - type: bind
        source: ${HARNESS_BROKER_CONTROL_CONFIG_HOST_DIR}
        target: ${HARNESS_BROKER_CONFIG_DIR}
        read_only: true
      - type: volume
        source: control-broker-data
        target: ${HARNESS_BROKER_DATA_DIR}
    healthcheck:
      interval: ${HARNESS_HEALTHCHECK_INTERVAL}
      timeout: ${HARNESS_HEALTHCHECK_TIMEOUT}
      retries: ${HARNESS_HEALTHCHECK_RETRIES}
      start_period: ${HARNESS_HEALTHCHECK_START_PERIOD}
      test: ["CMD-SHELL", "pidof mosquitto"]

volumes:
  control-broker-data:
