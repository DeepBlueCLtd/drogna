# The control broker, for the documented physical-separation fallback (FR-15).
#
# In this configuration observation traffic and control traffic sit on two brokers rather
# than on two topic namespaces of one. The observation broker keeps `deploy/broker/` exactly
# as it is; this directory is the second one, and it carries the control namespace alone.
#
# Nothing in any component's source changes to take this fallback. What changes is which
# broker a component's configuration points it at, which is the whole of what FR-15 asks
# for, and `deploy/broker/README.md` records the diff of taking it — including the one
# consequence that is not free, for components that need both namespaces.
#
# The listeners, the persistence and the identity rules are the same as the observation
# broker's, because they are properties of drogna's brokers rather than of this one.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
connection_messages true

# The same flow-control settings as the observation broker: they are properties of drogna's
# brokers rather than of one of them. See deploy/broker/mosquitto.conf for what they decide.
max_inflight_messages 2000
max_queued_messages 100000

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# 1883 for components, 9001 for the browser's WebSocket upgrade at the reverse proxy
# (ADR-0008). In this configuration the upgrade location points here rather than at the
# observation broker, which is a value in the proxy's configuration and not a code change.

listener 1883
protocol mqtt

listener 9001
protocol websockets
