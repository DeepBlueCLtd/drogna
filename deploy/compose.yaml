# The single Compose configuration for drogna. One file, every service, two destinations.
#
# Nothing in this file is written literally. Every hostname, port, path, limit, tag and
# profile arrives by interpolation from the environment file that the run scripts generate
# from `deploy/env.template` and the destination's `config/<destination>/deployment.json`.
# If you find yourself typing a number or a path here, it belongs in the destination
# configuration and its schema instead (Constitution IV, SRD NFR-05).
#
# A service listed here is not a claim that the component exists. Profiles decide what runs
# at a destination; heartbeats, and nothing else, decide what the client shows as alive
# (Constitution VII, SRD FR-45). `deploy/README.md` says which services are live today.

name: ${HARNESS_PROJECT_NAME}

# ---------------------------------------------------------------------------------------
# Shared fragments. Every service merges x-runtime; anything it does not merge is a
# deliberate exception with a comment saying why.
# ---------------------------------------------------------------------------------------

x-runtime: &runtime
  restart: ${HARNESS_RESTART_POLICY}
  logging:
    driver: ${HARNESS_LOG_DRIVER}
    options:
      max-size: ${HARNESS_LOG_MAX_SIZE}
      max-file: ${HARNESS_LOG_MAX_FILES}
  deploy:
    resources:
      limits:
        memory: ${HARNESS_LIMIT_MEMORY}
        cpus: ${HARNESS_LIMIT_CPUS}

x-healthcheck-timing: &healthcheck-timing
  interval: ${HARNESS_HEALTHCHECK_INTERVAL}
  timeout: ${HARNESS_HEALTHCHECK_TIMEOUT}
  retries: ${HARNESS_HEALTHCHECK_RETRIES}
  start_period: ${HARNESS_HEALTHCHECK_START_PERIOD}

# The destination's configuration directory, read-only. A container may read every file in
# it and is told which one is its own by HARNESS_CONFIG.
x-config-mount: &config-mount
  type: bind
  source: ${HARNESS_CONFIG_HOST_DIR}
  target: ${HARNESS_CONFIG_DIR}
  read_only: true

# Build context is the repository root for every image: the uv workspace lock and the
# client sources both sit above `deploy/`.
x-python-build: &python-build
  context: ${HARNESS_BUILD_CONTEXT}
  dockerfile: ${HARNESS_DOCKERFILE_PYTHON}
  secrets:
    - proxy_ca

# Every drogna Python image ships a `drogna-healthcheck` console script. It reads
# HARNESS_CONFIG, checks whatever that component considers healthy, and exits non-zero
# otherwise. The convention is owned by 001-deterministic-foundations.
x-python-healthcheck: &python-healthcheck
  <<: *healthcheck-timing
  test: ["CMD", "drogna-healthcheck"]

services:

  # C-01 simulation clock. The first component to be genuinely alive, and the source of
  # the first heartbeat (SRD FR-52).
  clock:
    <<: *runtime
    profiles: [foundation, full]
    build:
      <<: *python-build
      args:
        HARNESS_APP_ROOT: ${HARNESS_APP_ROOT}
        HARNESS_SERVICE: harness_clock
    environment:
      HARNESS_CONFIG: ${HARNESS_CONFIG_PATH_CLOCK}
    volumes:
      - *config-mount
      # The run manifest is the record a run can be replayed from, so it outlives the
      # container that wrote it. Writable: this is the only service that writes here.
      - type: volume
        source: run-data
        target: ${HARNESS_RUN_ROOT}
    ports:
      - ${HARNESS_PUBLISH_CLOCK}
    healthcheck: *python-healthcheck

  # C-02 environment generator.
  env-generator:
    <<: *runtime
    profiles: [generator, full]
    build:
      <<: *python-build
      args:
        HARNESS_APP_ROOT: ${HARNESS_APP_ROOT}
        HARNESS_SERVICE: harness_env_generator
    environment:
      HARNESS_CONFIG: ${HARNESS_CONFIG_PATH_ENV_GENERATOR}
    volumes:
      - *config-mount
      # The environment store, and the coverage store is not mounted here: this component
      # names no directory inside it. It carried a writable coverage mount for a wave, which
      # was neither used nor noticed, because nothing was comparing what a component names
      # with what the deployment mounts.
      - type: volume
        source: environment-data
        target: ${HARNESS_ENVIRONMENT_ROOT}
    depends_on:
      clock:
        condition: service_healthy
    healthcheck: *python-healthcheck

  # C-03 broker. Its configuration and access control lists live in `deploy/broker/` and
  # are owned by 007-observation-path; this file supplies only the mount and the ports.
  broker:
    <<: *runtime
    profiles: [broker, full]
    image: eclipse-mosquitto:2.0.22@sha256:212f89e1eaeb2c322d6441b64396e3346026674db8fa9c27beac293405c32b3c
    volumes:
      - type: bind
        source: ${HARNESS_BROKER_CONFIG_HOST_DIR}
        target: ${HARNESS_BROKER_CONFIG_DIR}
        read_only: true
      - type: volume
        source: broker-data
        target: ${HARNESS_BROKER_DATA_DIR}
    ports:
      - ${HARNESS_PUBLISH_BROKER}
    healthcheck:
      <<: *healthcheck-timing
      # A process check, not a connect check. A connect check needs credentials that the
      # access control lists in `deploy/broker/` will define; tighten this to a
      # mosquitto_sub on the $$SYS branch when 007-observation-path lands them.
      test: ["CMD-SHELL", "pidof mosquitto"]

  # C-04 simulated sensors.
  sensors:
    <<: *runtime
    profiles: [observation, full]
    build:
      <<: *python-build
      args:
        HARNESS_APP_ROOT: ${HARNESS_APP_ROOT}
        HARNESS_SERVICE: harness_sensors
    environment:
      HARNESS_CONFIG: ${HARNESS_CONFIG_PATH_SENSORS}
    volumes:
      - *config-mount
      # Samples the generated field and writes nothing back to it.
      - type: volume
        source: environment-data
        target: ${HARNESS_ENVIRONMENT_ROOT}
        read_only: true
    depends_on:
      broker:
        condition: service_healthy
      clock:
        condition: service_healthy
    healthcheck: *python-healthcheck

  # C-05 ingest client, the single ingestion seam.
  ingest:
    <<: *runtime
    profiles: [observation, full]
    build:
      <<: *python-build
      args:
        HARNESS_APP_ROOT: ${HARNESS_APP_ROOT}
        HARNESS_SERVICE: harness_ingest
    environment:
      HARNESS_CONFIG: ${HARNESS_CONFIG_PATH_INGEST}
    volumes:
      - *config-mount
    depends_on:
      broker:
        condition: service_healthy
      observations:
        condition: service_healthy
    healthcheck: *python-healthcheck

  # C-06 observation store, and the host of C-07's `features` schema. One Postgres
  # instance carrying two schemas, per the constitution's technology constraints.
  observations:
    <<: *runtime
    profiles: [core, full]
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    deploy:
      resources:
        limits:
          memory: ${HARNESS_LIMIT_MEMORY_OBSERVATIONS}
          cpus: ${HARNESS_LIMIT_CPUS_OBSERVATIONS}
    # Postgres is configured by its published environment interface rather than by
    # HARNESS_CONFIG; it is a third-party image and reads no drogna configuration file.
    # Every value below still comes from the destination configuration.
    environment:
      POSTGRES_DB: ${HARNESS_DATABASE_NAME}
      POSTGRES_USER: ${HARNESS_DATABASE_USER}
      POSTGRES_PASSWORD: ${HARNESS_DATABASE_PASSWORD}
      PGDATA: ${HARNESS_DATABASE_DATA_DIR}
    volumes:
      - type: volume
        source: observations-data
        target: ${HARNESS_DATABASE_DATA_DIR}
    ports:
      - ${HARNESS_PUBLISH_OBSERVATIONS}
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD-SHELL", "pg_isready -U ${HARNESS_DATABASE_USER} -d ${HARNESS_DATABASE_NAME}"]

  # C-07 feature store. Static spatial reference, provisioned by script at scenario start
  # and read-only thereafter, so it is a one-shot job rather than a long-lived service.
  features:
    <<: *runtime
    profiles: [provisioning, full]
    restart: "no"
    labels:
      harness.lifecycle: one-shot
    build:
      <<: *python-build
      args:
        HARNESS_APP_ROOT: ${HARNESS_APP_ROOT}
        HARNESS_SERVICE: harness_features
    environment:
      HARNESS_CONFIG: ${HARNESS_CONFIG_PATH_FEATURES}
    volumes:
      - *config-mount
    depends_on:
      observations:
        condition: service_healthy

  # C-09 query layer. C-08, the coverage store, is the `coverage-data` volume this service
  # reads; it has no process of its own.
  query:
    <<: *runtime
    profiles: [query, full]
    build:
      context: ${HARNESS_BUILD_CONTEXT}
      dockerfile: ${HARNESS_DOCKERFILE_QUERY}
      secrets:
        - proxy_ca
      args:
        HARNESS_APP_ROOT: ${HARNESS_APP_ROOT}
    environment:
      HARNESS_CONFIG: ${HARNESS_CONFIG_PATH_QUERY}
    volumes:
      - *config-mount
      - type: volume
        source: coverage-data
        target: ${HARNESS_COVERAGE_ROOT}
        read_only: true
    ports:
      - ${HARNESS_PUBLISH_QUERY}
    depends_on:
      observations:
        condition: service_healthy
    # Probed over HTTP, and probed with python3 because this is the one image in the
    # deployment that has no `wget`. `python:3.11-slim-bookworm` ships neither wget nor
    # curl, so `wget --spider` was a health check that could only ever report unhealthy —
    # the container served 200 to anything that asked while Compose waited out the full
    # timeout on a program that was not there, and everything downstream of it never
    # started. The alpine-based proxy and client keep wget, which they have.
    #
    # `drogna-healthcheck` is in this image and is deliberately not used: it answers "am I
    # configured", not "am I serving", and the proxy depends on this condition precisely
    # because it needs the second question answered.
    healthcheck:
      <<: *healthcheck-timing
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('${HARNESS_HEALTH_URL_QUERY}')"

  # C-10 reverse proxy. Default deny at the boundary; its configuration is owned by
  # 013-security-proxy.
  proxy:
    <<: *runtime
    profiles: [edge, full]
    # Built, not pulled. The stock nginx image was named here for a while, which meant the
    # renderer in `proxy/` never ran and nginx served its own default configuration —
    # answering nothing this repository had written, and failing every case in the request
    # matrix with "the proxy never answered".
    build:
      context: ${HARNESS_BUILD_CONTEXT}
      dockerfile: ${HARNESS_DOCKERFILE_PROXY}
      args:
        HARNESS_APP_ROOT: ${HARNESS_APP_ROOT}
      secrets:
        - proxy_ca
    # HARNESS_CONFIG and nothing else. The listen port used to be passed alongside it,
    # which Constitution IV forbids: one variable per component, and everything else
    # arrives inside the document it names.
    environment:
      HARNESS_CONFIG: ${HARNESS_CONFIG_PATH_PROXY}
    volumes:
      - *config-mount
    ports:
      - ${HARNESS_PUBLISH_PROXY}
    # nginx resolves every upstream name once, at start-up, and refuses the whole
    # configuration when one of them does not resolve — `host not found in upstream
    # "query"`, and the boundary never comes up at all. So the proxy cannot start before
    # the service it proxies to exists, and this is an ordering requirement rather than a
    # preference. It was absent while the `edge` profile was never active alongside
    # `query`, and cost the whole boundary the moment both were promoted.
    depends_on:
      query:
        condition: service_healthy
    # Probed on the health surface its configuration declares, not on the published
    # listener. The boundary is default-deny, so a probe against the listener is answered
    # 401 and the container could never become healthy however well it was working.
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD-SHELL", "wget --spider -q ${HARNESS_HEALTH_URL_PROXY}"]

  # C-11 monitor.
  monitor:
    <<: *runtime
    profiles: [control, full]
    build:
      <<: *python-build
      args:
        HARNESS_APP_ROOT: ${HARNESS_APP_ROOT}
        HARNESS_SERVICE: harness_monitor
    environment:
      HARNESS_CONFIG: ${HARNESS_CONFIG_PATH_MONITOR}
    volumes:
      - *config-mount
      # The coverage read port: resolve the current pointer, read that run's forecast.
      # Read-only, because scoring observations against a field never writes one.
      - type: volume
        source: coverage-data
        target: ${HARNESS_COVERAGE_ROOT}
        read_only: true
    depends_on:
      broker:
        condition: service_healthy
    healthcheck: *python-healthcheck

  # C-12 scheduler.
  scheduler:
    <<: *runtime
    profiles: [control, full]
    build:
      <<: *python-build
      args:
        HARNESS_APP_ROOT: ${HARNESS_APP_ROOT}
        HARNESS_SERVICE: harness_scheduler
    environment:
      HARNESS_CONFIG: ${HARNESS_CONFIG_PATH_SCHEDULER}
    volumes:
      - *config-mount
    depends_on:
      broker:
        condition: service_healthy
    healthcheck: *python-healthcheck

  # C-13 model runner.
  model-runner:
    <<: *runtime
    profiles: [control, full]
    build:
      <<: *python-build
      args:
        HARNESS_APP_ROOT: ${HARNESS_APP_ROOT}
        HARNESS_SERVICE: harness_model_runner
    environment:
      HARNESS_CONFIG: ${HARNESS_CONFIG_PATH_MODEL_RUNNER}
    volumes:
      - *config-mount
      # Ground truth is read and never written by the runner; the generator owns it.
      - type: volume
        source: environment-data
        target: ${HARNESS_ENVIRONMENT_ROOT}
        read_only: true
      # Writable, and the coverage store rather than a staging volume of its own: the
      # runner writes a run into staging and the publisher makes it visible with a rename,
      # and a rename between two volumes is a copy, which the publisher refuses rather than
      # performing non-atomically. Staging therefore sits inside this store.
      - type: volume
        source: coverage-data
        target: ${HARNESS_COVERAGE_ROOT}
    depends_on:
      broker:
        condition: service_healthy
    healthcheck: *python-healthcheck

  # C-14 publisher. Makes completed runs visible atomically.
  publisher:
    <<: *runtime
    profiles: [control, full]
    build:
      <<: *python-build
      args:
        HARNESS_APP_ROOT: ${HARNESS_APP_ROOT}
        HARNESS_SERVICE: harness_publisher
    environment:
      HARNESS_CONFIG: ${HARNESS_CONFIG_PATH_PUBLISHER}
    volumes:
      - *config-mount
      # Both ends of the publication step — the staging area it reads and the catalogue and
      # pointer it writes — are inside this one volume, which is what makes the step a
      # rename rather than a copy.
      - type: volume
        source: coverage-data
        target: ${HARNESS_COVERAGE_ROOT}
    depends_on:
      broker:
        condition: service_healthy
    healthcheck: *python-healthcheck

  # C-15 planner. Emits recommendations; commands nothing (Constitution VIII).
  planner:
    <<: *runtime
    profiles: [planning, full]
    build:
      <<: *python-build
      args:
        HARNESS_APP_ROOT: ${HARNESS_APP_ROOT}
        HARNESS_SERVICE: harness_planner
    environment:
      HARNESS_CONFIG: ${HARNESS_CONFIG_PATH_PLANNER}
    volumes:
      - *config-mount
      # Reads the published uncertainty field and the environment manifest. It recommends
      # and decides nothing (Constitution VIII), and it writes to neither store.
      - type: volume
        source: coverage-data
        target: ${HARNESS_COVERAGE_ROOT}
        read_only: true
      - type: volume
        source: environment-data
        target: ${HARNESS_ENVIRONMENT_ROOT}
        read_only: true
    depends_on:
      broker:
        condition: service_healthy
    healthcheck: *python-healthcheck

  # C-16 telemetry. Turns the residual stream the monitor already produces into reported
  # statistics and a forecast skill score against a persistence reference. It owns the
  # failure mode of silent degradation, so it is the one component whose absence should be
  # conspicuous.
  #
  # One block: this service was declared twice, once when feature 005
  # pre-provisioned every component and again when feature 010 was built. Docker Compose
  # refuses a repeated mapping key outright — "mapping key already defined" — so nothing
  # deployed at all, and every container-backed test failed with it. Merged rather than
  # deduplicated, because each copy carried something the other did not: the published
  # port came from one and the coverage volume the persistence reference reads from the
  # other.
  telemetry:
    <<: *runtime
    profiles: [telemetry, full]
    build:
      <<: *python-build
      args:
        HARNESS_APP_ROOT: ${HARNESS_APP_ROOT}
        HARNESS_SERVICE: harness_telemetry
    environment:
      HARNESS_CONFIG: ${HARNESS_CONFIG_PATH_TELEMETRY}
    volumes:
      - *config-mount
      # The persistence reference is a published forecast field, read through the coverage
      # read port at publication boundaries and nowhere else. Read-only for that reason:
      # reading is the whole of what this component does with the store.
      - type: volume
        source: coverage-data
        target: ${HARNESS_COVERAGE_ROOT}
        read_only: true
    ports:
      - ${HARNESS_PUBLISH_TELEMETRY}
    depends_on:
      broker:
        condition: service_healthy
    healthcheck: *python-healthcheck

  # C-17 offload packager.
  offload:
    <<: *runtime
    profiles: [offload, full]
    build:
      <<: *python-build
      args:
        HARNESS_APP_ROOT: ${HARNESS_APP_ROOT}
        HARNESS_SERVICE: harness_offload
    environment:
      HARNESS_CONFIG: ${HARNESS_CONFIG_PATH_OFFLOAD}
    volumes:
      - *config-mount
      # The recorded run it packages: the clock's run manifest and the observation stream.
      # Read-only — a packager that could rewrite its own source could not be replayed
      # against it. The coverage store is not mounted here; this component names no
      # directory inside it, and the read-only mount it used to carry was a guess.
      - type: volume
        source: run-data
        target: ${HARNESS_RUN_ROOT}
        read_only: true
      # Its own durable state: staging bundles and the write-ahead ledger, one volume so
      # that a ledger can never outlive the bundles it accounts for.
      - type: volume
        source: offload-data
        target: ${HARNESS_OFFLOAD_ROOT}
      # The released surface, read-only. Bundles hold point observations, which SRD FR-42
      # withholds from what is released; the packager's own configuration refuses a staging
      # area inside this directory, and this mount is the platform enforcing the same rule.
      - type: volume
        source: released-data
        target: ${HARNESS_RELEASED_ROOT}
        read_only: true
    depends_on:
      broker:
        condition: service_healthy
    healthcheck: *python-healthcheck

  # C-18 browser client. Static assets built from `client/` and served by nginx.
  client:
    <<: *runtime
    profiles: [shell, full]
    build:
      context: ${HARNESS_BUILD_CONTEXT}
      dockerfile: ${HARNESS_DOCKERFILE_CLIENT}
      secrets:
        - proxy_ca
      args:
        HARNESS_APP_ROOT: ${HARNESS_APP_ROOT}
        HARNESS_STATIC_ROOT: ${HARNESS_STATIC_ROOT}
        HARNESS_NGINX_TEMPLATE_DIR: ${HARNESS_NGINX_TEMPLATE_DIR}
    # nginx is a third-party image and reads no drogna configuration file. It is told its
    # listen port and its document root the way its own published interface expects, and
    # both values still come from the destination configuration. See deploy/README.md,
    # "The one meaningful environment variable, and its exceptions".
    environment:
      HARNESS_CONFIG: ${HARNESS_CONFIG_PATH_CLIENT}
      HARNESS_PORT_CLIENT: ${HARNESS_PORT_CLIENT}
      HARNESS_STATIC_ROOT: ${HARNESS_STATIC_ROOT}
    volumes:
      - *config-mount
    ports:
      - ${HARNESS_PUBLISH_CLIENT}
    healthcheck:
      <<: *healthcheck-timing
      test: ["CMD-SHELL", "wget --spider -q ${HARNESS_HEALTH_URL_CLIENT}"]

# ---------------------------------------------------------------------------------------
# Build secrets. One, optional, and inert unless a machine supplies it.
#
# HARNESS_PROXY_CA_FILE names the certificate authority of a TLS-terminating egress proxy,
# for the case the bring-up is run inside an ephemeral agent session whose route to the
# package index is intercepted (SRD NFR-06). It defaults to an empty source, which every
# image definition treats as "no proxy" and installs exactly as it would on a machine with
# direct egress. It is a property of the machine rather than of the destination, which is
# why it is the one value here that does not come from config/<destination>/ — it names no
# host, is read only during a build, and reaches no running container.
# ---------------------------------------------------------------------------------------

secrets:
  proxy_ca:
    file: ${HARNESS_PROXY_CA_FILE:-/dev/null}

# ---------------------------------------------------------------------------------------
# Volumes. Every one of these is derived data with a named producing script; see the volume
# table in `deploy/README.md`. Nothing here survives `scripts/reset.sh`, by design.
# ---------------------------------------------------------------------------------------

volumes:
  observations-data:
  broker-data:
  coverage-data:
  environment-data:
  run-data:
  offload-data:
  released-data:
