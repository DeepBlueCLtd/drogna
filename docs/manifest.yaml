# The documentation manifest (FR-011, FR-012, FR-021).
#
# This file declares what the published site must carry. It is the thing that makes a
# gap visible: without it, a required page that was never written, or one that quietly
# became a stub, fails nothing and nobody notices. Four gates read it.
#
# Adding a page is adding a line under `pages:`. Nothing else has to change.
#
# The site source lives under `docs_root`. Every path below is relative to it.

version: 1
docs_root: site/docs

# ---------------------------------------------------------------------------
# What separates a page from a stub
# ---------------------------------------------------------------------------
#
# Two rules, because one is not enough.
#
# **The marker.** A page that says it is a stub is a stub, whatever its length. Five
# pages on this site opened with `!!! warning "Stub — ..."` on the day this file was
# written, and the honest reading of FR-011 is that such a page has not been written.
# `stub_marker` below is the pattern that recognises one. All five have since been
# written; the pattern stays, because the next one will be spelt the same way.
#
# **The length.** A floor, for the page that is a stub without saying so.
#
# The length alone cannot do the job, and the corpus is what proved it. Measured on
# 2026-08-27, with YAML front matter stripped and whitespace-separated tokens counted:
#
#   the five self-declared stubs            331, 422, 422, 426, 490 words
#   the shortest fully written page         249 words (subsystems/c16-telemetry.md)
#
# The stubs were *longer* than the shortest accepted page. A single threshold that
# caught every stub would have rejected most of the subsystem reference. So the floor is
# declared per kind of page, and each kind's floor is bounded by what is on disk rather
# than chosen:
#
#   index      80  — below the shortest section index (blog/index.md)
#   page      210  — below the shortest accepted reference page
#   narrative 500  — above the longest page the project produced while calling it
#                    unwritten (490), and far below the shortest written narrative page
#
# `site/gates/tests/test_manifest.py` re-derives both bounds on every run: a floor may
# not be raised above a page the project has already accepted as finished, and may not
# be lowered to or below a page that declares itself a stub. Lowering `narrative` to
# make a run green fails that test.
#
# The stubs above were all written within a day of this file being laid, which would
# have left the lower bound deriving from nothing — a check that examined nothing and
# looked exactly like a clean run. So the worst case is kept:
# `site/gates/fixtures/stub_control/narrative.md` is the longest stub the project
# actually produced, preserved at its length and carrying its marker, and it is not
# published. `bounded_by: above-every-declared-stub` is what says a kind keeps one.

stub_marker: '^!!!\s+\w+\s+"Stub\b'

kinds:
  # `bounded_by` names the derivation the test re-performs. See test_manifest.py.
  index: {min_words: 80, bounded_by: shortest-accepted}
  page: {min_words: 210, bounded_by: shortest-accepted}
  narrative: {min_words: 500, bounded_by: above-every-declared-stub}

# ---------------------------------------------------------------------------
# The pages PR-09 requires
# ---------------------------------------------------------------------------
#
# One line per page: the path, its kind, and — for a subsystem page — the component
# identifier it accounts for. `min_words:` may be given on a line to override its kind.
#
# This is the required set, not the published set. A page may be published without
# appearing here; what appears here must exist, must not be a stub, and must clear its
# floor. `site/docs/decisions/site-tooling.md` is the current example of the former: it
# is published, and PR-09 does not require it.

pages:
  index.md: {kind: page}
  glossary.md: {kind: page}

  architecture/overview.md: {kind: narrative}

  subsystems/index.md: {kind: index}
  subsystems/c01-simulation-clock.md: {kind: page, component: C-01}
  subsystems/c02-environment-generator.md: {kind: page, component: C-02}
  subsystems/c03-broker.md: {kind: page, component: C-03}
  subsystems/c04-simulated-sensors.md: {kind: page, component: C-04}
  subsystems/c05-ingest-client.md: {kind: page, component: C-05}
  subsystems/c06-observation-store.md: {kind: page, component: C-06}
  subsystems/c07-feature-store.md: {kind: page, component: C-07}
  subsystems/c08-coverage-store.md: {kind: page, component: C-08}
  subsystems/c09-query-layer.md: {kind: page, component: C-09}
  subsystems/c10-reverse-proxy.md: {kind: page, component: C-10}
  subsystems/c11-monitor.md: {kind: page, component: C-11}
  subsystems/c12-scheduler.md: {kind: page, component: C-12}
  subsystems/c13-model-runner.md: {kind: page, component: C-13}
  subsystems/c14-publisher.md: {kind: page, component: C-14}
  subsystems/c15-planner.md: {kind: page, component: C-15}
  subsystems/c16-telemetry.md: {kind: page, component: C-16}
  subsystems/c17-offload-packager.md: {kind: page, component: C-17}
