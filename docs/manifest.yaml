# ---------------------------------------------------------------------------
# Components not yet accounted for by a page (FR-012)
# ---------------------------------------------------------------------------
#
# `site/gates/check_subsystem_coverage.py` reads the component identifiers out of the
# SRD's component table — it counts no fixed number of them, so a C-19 added to the SRD
# becomes a finding the day it appears. Every identifier must either be claimed by a
# page above, through its `component:` key, or appear here with a reason.
#
# One line per component, e.g.
#
#   C-19: not yet built — the SRD names it, no code exists, no page written.
#
# The map is empty because all eighteen identifiers in the SRD today are claimed by a
# page. An entry here is an admission, not a default: it has to be typed.

components: {}

# ---------------------------------------------------------------------------
# Architecture Decision Records (FR-021)
# ---------------------------------------------------------------------------
#
# Whether ADRs are published is a decision, and FR-021 asks for it to be recorded here
# rather than inferred from whichever files the build happened to glob. This block is
# what makes it a recorded decision. Were it absent, ADRs would be unpublished by
# accident and nobody could tell that from unpublished on purpose.
#
# Decided 2026-08-27: publish them. The records are the answer to "why is it built like
# this", they are already written for a reader who was not in the room, and FR-022
# forbids the site keeping a standing open-questions list precisely because a resolved
# question is supposed to be findable as an ADR. Publishing nothing would make that
# sentence false.
#
# **This entry is load-bearing, not declarative.** `site/hooks/publish_adrs.py` reads
# `adrs.published` at build time: set it to `false`, or remove it, and the build stops
# rendering the records and says so on the index instead. Flipping it changes the
# published site. `site/gates/check_adr.py` checks the build against it in both
# directions, and the gate here checks the shallow half — that a manifest saying
# "published" is not contradicted by a `source` holding no record to publish. It does
# not check `destination`: the records are rendered into the build and never written
# back into the source, so there would be nothing there to find.

adrs:
  published: true
  source: docs/adr
  destination: decisions
  decided: 2026-08-27

# ---------------------------------------------------------------------------
# Acknowledged hostnames (FR-005 edge case; read by check_deployment_hostnames.py)
# ---------------------------------------------------------------------------
#
# A deployment hostname reaching the built output is a finding. Some are legitimate —
# an example host in a configuration snippet, a standards authority in a namespace URI
# — and the rule is that a legitimate one is acknowledged here explicitly rather than
# passing silently. A hostname the gate finds that is not listed below fails the run.
#
# One line per acknowledgement:
#
#   - {host: example.invalid, where: standards/ogc-api-edr.md, reason: why it is fine}
#
# `host` is matched exactly against the hostname the gate extracted; `where` is the
# published path it is expected on, and `reason` is what a reviewer reads. All three
# are required — an acknowledgement nobody had to justify is an acknowledgement nobody
# reviewed, which is the same rule the exemption markers in `scripts/_gate_lib.py`
# follow.
#
# The list is empty. Nothing has been acknowledged, which is not the same as nothing
# having been looked for.

acknowledged_hostnames: []
