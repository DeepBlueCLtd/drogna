[project]
name = "harness-types"
version = "0.1.0"
description = "Generated Python types for every shape that crosses a language boundary (Constitution III)"
requires-python = ">=3.11"
dependencies = [
    # Pydantic v2 is the only runtime dependency the generated models have. It is here
    # rather than in each consumer because a consumer imports the model, not the
    # generator: nothing outside this package needs to know which tool wrote it.
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_types"]
