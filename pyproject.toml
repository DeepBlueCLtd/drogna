[project]
name = "drogna-harness"
version = "0.1.0"
description = "Environmental data architecture harness — synthetic data, fake numerics, learning purposes only"
requires-python = ">=3.11"

# Workspace members are listed here so that `uv sync` installs them into the
# environment. Without this, `uv sync` resolves the workspace but installs
# nothing from it, and every test that imports a harness package fails to
# collect. Add each new library here as it is created.
dependencies = [
    "harness-clock",
    "harness-core",
    "harness-env-generator",
    "harness-features",
    "harness-ingest",
    "harness-model-runner",
    "harness-monitor",
    "harness-offload",
    "harness-planner",
    "harness-publisher",
    "harness-scheduler",
    "harness-sensors",
    "harness-telemetry",
    "harness-types",
]

[tool.uv.sources]
harness-clock = { workspace = true }
harness-core = { workspace = true }
harness-env-generator = { workspace = true }
harness-features = { workspace = true }
harness-ingest = { workspace = true }
harness-model-runner = { workspace = true }
harness-monitor = { workspace = true }
harness-offload = { workspace = true }
harness-planner = { workspace = true }
harness-publisher = { workspace = true }
harness-scheduler = { workspace = true }
harness-sensors = { workspace = true }
harness-telemetry = { workspace = true }
harness-types = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # The generator half of Constitution III's chain. It is a development dependency
    # rather than a component one because nothing at run time needs it: the models it
    # writes are committed, and a checkout builds without it. It is pinned to an exact
    # version, and `contracts/openapi/generators.toml` records why: the generated tree is
    # compared byte for byte in CI, so the tool that writes it is part of the contract.
    "datamodel-code-generator==0.75.1",
]

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["libs/harness_types", "client/src/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
# `scripts` is here because the gates' own tests live in `scripts/tests/`, and until it
# was added they were collected by nobody: `uv run pytest` walked four directories and
# none of them was that one. A gate whose test never runs is a gate that has never been
# seen to fail, which is the one thing this repository refuses to accept from a check.
#
# `site` is here for the same reason and was added the same way: feature 015's publication
# gates live in `site/gates/tests/`, and the day they were written they were collected by
# nobody. Three separate agents reported it independently, which is how visible the gap is
# once the directory exists — and how invisible it is while a bare `uv run pytest` reports
# a clean run over everything except the thing you just wrote.
testpaths = ["libs", "proxy", "scripts", "services", "site", "tests"]
# importlib import mode lets two packages each have a tests/test_manifest.py without
# colliding. Under the default prepend mode pytest inserts each test directory on
# sys.path and imports by bare module name, so the second test_manifest.py it meets is
# refused as a duplicate of the first. Every service will have a test_config.py and a
# test_manifest.py, so the alternative is a naming convention that grows uglier with
# each component added, to work around an import mode nobody chose deliberately.
addopts = "-q --import-mode=importlib"
# Each package's tests import their shared helpers from a `support` module beside them,
# so each test directory must be importable. Under the default import mode pytest did
# this implicitly; importlib mode does not, and doing it explicitly is better anyway —
# the helpers are imported because they are on the path on purpose, not because pytest
# happened to put them there.
pythonpath = [
    "services/clock/tests",
    "services/env_generator/tests",
    "services/monitor/tests",
    "services/planner/tests",
    "services/scheduler/tests",
    "services/model_runner/tests",
    "services/publisher/tests",
    "services/sensors/tests",
    "services/ingest/tests",
    "services/offload/tests",
    "services/telemetry/tests",
    "tests/support",
    "tests/acceptance",
]
