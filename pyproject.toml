[project]
name = "drogna-harness"
version = "0.1.0"
description = "Environmental data architecture harness — synthetic data, fake numerics, learning purposes only"
requires-python = ">=3.11"

# Workspace members are listed here so that `uv sync` installs them into the
# environment. Without this, `uv sync` resolves the workspace but installs
# nothing from it, and every test that imports a harness package fails to
# collect. Add each new library here as it is created.
dependencies = [
    "harness-core",
    "harness-env-generator",
    "harness-types",
]

[tool.uv.sources]
harness-core = { workspace = true }
harness-env-generator = { workspace = true }
harness-types = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    # The generator half of Constitution III's chain. It is a development dependency
    # rather than a component one because nothing at run time needs it: the models it
    # writes are committed, and a checkout builds without it. It is pinned to an exact
    # version, and `contracts/openapi/generators.toml` records why: the generated tree is
    # compared byte for byte in CI, so the tool that writes it is part of the contract.
    "datamodel-code-generator==0.75.1",
]

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["libs/harness_types", "client/src/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["libs", "services", "tests"]
# importlib import mode lets two packages each have a tests/test_manifest.py without
# colliding. Under the default prepend mode pytest inserts each test directory on
# sys.path and imports by bare module name, so the second test_manifest.py it meets is
# refused as a duplicate of the first. Every service will have a test_config.py and a
# test_manifest.py, so the alternative is a naming convention that grows uglier with
# each component added, to work around an import mode nobody chose deliberately.
addopts = "-q --import-mode=importlib"
# Each package's tests import their shared helpers from a `support` module beside them,
# so each test directory must be importable. Under the default import mode pytest did
# this implicitly; importlib mode does not, and doing it explicitly is better anyway —
# the helpers are imported because they are on the path on purpose, not because pytest
# happened to put them there.
pythonpath = ["services/env_generator/tests"]
