[project]
name = "harness-clock"
version = "0.1.0"
description = "C-01: the simulation clock as a component — HTTP control, ctl/clock samples, ctl/heartbeat liveness"
requires-python = ">=3.11"
dependencies = [
    "harness-core",
    "harness-types",
]

[tool.uv.sources]
harness-core = { workspace = true }
harness-types = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_clock"]
