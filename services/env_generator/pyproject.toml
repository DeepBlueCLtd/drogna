[project]
name = "harness-env-generator"
version = "0.1.0"
description = "C-02: the synthetic environment generator and the ground-truth manifest it writes"
requires-python = ">=3.11"
dependencies = [
    "harness-core",
]

[tool.uv.sources]
harness-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_env_generator"]
