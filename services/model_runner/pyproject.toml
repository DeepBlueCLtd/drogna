[project]
name = "harness-model-runner"
version = "0.1.0"
description = "C-13: the model runner, which owns the failure mode of being irreplaceable"
requires-python = ">=3.11"
dependencies = [
    "harness-core",
    "harness-types",
    # For the NetCDF classic encoder in harness_env_generator.writer, which is the one
    # implementation of that format in the repository. A second copy here would be the
    # duplication ADR-0005 argues against in the neighbouring case, so the import stands
    # until the encoder moves to a shared library, at which point one line changes.
    "harness-env-generator",
]

[tool.uv.sources]
harness-core = { workspace = true }
harness-types = { workspace = true }
harness-env-generator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_model_runner"]
