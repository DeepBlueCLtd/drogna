[project]
name = "harness-offload"
version = "0.1.0"
description = "C-17: the offload packager, which owns the failure mode of premature eviction"
requires-python = ">=3.11"
dependencies = [
    # For `encode_netcdf` and `read_netcdf`, the one NetCDF encoder in the repository and
    # the one reader that matches it. The encoder lived in the environment generator until
    # this package became its third consumer, after the model runner; the reader lived in
    # the divergence monitor until this package's conformance check and the planner's
    # spread reader each imported it across a service boundary. Both are in harness_core
    # now and this package reaches neither through another service.
    "harness-core",
    "harness-types",
]

[tool.uv.sources]
harness-core = { workspace = true }
harness-types = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_offload"]
