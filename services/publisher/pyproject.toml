[project]
name = "harness-publisher"
version = "0.1.0"
description = "C-14: the publisher, which owns the failure mode of partial visibility"
requires-python = ">=3.11"
dependencies = [
    "harness-core",
    "harness-types",
]

[tool.uv.sources]
harness-core = { workspace = true }
harness-types = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_publisher"]
