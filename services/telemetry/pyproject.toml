[project]
name = "harness-telemetry"
version = "0.1.0"
description = "C-16: telemetry and forecast quality, which owns the failure mode of silent degradation"
requires-python = ">=3.11"
dependencies = [
    "harness-core",
    "harness-types",
    # C-11's package, for the coverage read port and nothing else. The read side of the
    # coverage output port has one implementation in this repository and it lives there;
    # a second NetCDF reader here would be a second implementation of a read that already
    # exists, which is the argument ADR-0005 makes about sound speed applied to a file
    # format. The port's honest home is libs/harness_core or stores/coverage, and moving
    # it is the owning feature's call rather than this one's.
    "harness-monitor",
]

[tool.uv.sources]
harness-core = { workspace = true }
harness-types = { workspace = true }
harness-monitor = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_telemetry"]
