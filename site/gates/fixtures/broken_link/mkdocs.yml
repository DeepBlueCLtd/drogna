# A miniature site that is wrong on purpose. See ../README.md.
#
# The `validation:` block below is COPIED FROM site/mkdocs.yml and must stay identical to
# it. That is what makes this fixture evidence about the real build rather than about a
# configuration of its own: `site/gates/tests/test_link_validation.py` reads both and fails
# if they differ, so relaxing the real site's validation cannot leave this control quietly
# proving the old settings still worked.
site_name: broken-link control
docs_dir: docs

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Published: published.md
