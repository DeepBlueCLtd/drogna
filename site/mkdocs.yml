# Site build for drogna. Build-time tooling, not a runtime component: the
# configuration contract of Constitution IV binds components, not this file.
# No deployment hostname appears here — the site is built with relative URLs so
# it serves correctly from any base path the publishing workflow puts it under.

site_name: drogna
site_description: >-
  A learning harness for an environmental data architecture. Synthetic data,
  deliberately fake numerics, built to be understood rather than deployed.

docs_dir: docs
# `build` is already ignored by the repository's .gitignore, so the built site
# is never accidentally committed alongside its source.
site_dir: build

use_directory_urls: true

theme:
  name: material
  custom_dir: overrides
  # Material fetches Google Fonts by default. The site must issue no request to
  # another origin (PR-01), so system fonts are used instead.
  font: false
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - blog:
      blog_dir: blog
      post_url_format: "{slug}"
      post_excerpt: required
      authors: false
      archive_toc: true
      categories_allowed:
        - Process
        - Architecture
        - Standards
        - Feature

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.caret
  - pymdownx.tilde
  # Mathematics is emitted in generic mode. The renderer that consumes it must
  # be served from this origin; see docs/decisions/site-tooling.md.
  - pymdownx.arithmatex:
      generic: true

# No analytics, no external social cards, no third-party diagram renderer.
extra:
  generator: false

nav:
  - Home: index.md
  - Blog:
      - blog/index.md
  - Subsystems:
      - subsystems/index.md
      - C-01 Simulation clock: subsystems/c01-simulation-clock.md
      - C-02 Environment generator: subsystems/c02-environment-generator.md
      - C-03 Broker: subsystems/c03-broker.md
      - C-04 Simulated sensors: subsystems/c04-simulated-sensors.md
      - C-05 Ingest client: subsystems/c05-ingest-client.md
      - C-06 Observation store: subsystems/c06-observation-store.md
      - C-07 Feature store: subsystems/c07-feature-store.md
      - C-08 Coverage store: subsystems/c08-coverage-store.md
      - C-09 Query layer: subsystems/c09-query-layer.md
      - C-10 Reverse proxy: subsystems/c10-reverse-proxy.md
      - C-11 Monitor: subsystems/c11-monitor.md
      - C-12 Scheduler: subsystems/c12-scheduler.md
      - C-13 Model runner: subsystems/c13-model-runner.md
      - C-14 Publisher: subsystems/c14-publisher.md
      - C-15 Planner: subsystems/c15-planner.md
      - C-16 Telemetry: subsystems/c16-telemetry.md
      - C-17 Offload packager: subsystems/c17-offload-packager.md
      - C-18 Browser client: subsystems/c18-browser-client.md
  - Algorithms:
      - algorithms/index.md
      - Ensemble spread: algorithms/ensemble-spread.md
      - Advection: algorithms/advection.md
      - Informative path planning: algorithms/informative-path-planning.md
  - Standards:
      - standards/index.md
      - SensorThings: standards/sensorthings.md
      - OGC API-EDR: standards/ogc-api-edr.md
      - CF conventions: standards/cf-conventions.md
      - CoverageJSON: standards/coveragejson.md
  - Glossary: glossary.md
  - Decisions:
      - decisions/site-tooling.md
