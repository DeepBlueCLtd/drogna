# Client authentication for the observation store. ADR-0023.
#
# Trust, deliberately, for connections that reach this server at all — and nothing else.
#
# The harness models no database threat. The store's port is published to 127.0.0.1 at
# every destination (`config/*/deployment.json`, `network.publish.observations.bind`; only
# the droplet's proxy is on 0.0.0.0), so a connection here has already had to be on the
# compose network or on the host's own loopback. A password in front of that guards
# nothing, and the machinery that generated, stored and injected one was the largest piece
# of deploy-time apparatus in the repository — three generated secrets, an ALTER ROLE in
# the seeding step, and a DSN rewriter — all of it in service of a boundary that the
# network already draws.
#
# What is *not* given up is authorisation. `roles.sql` still refuses everybody but
# drogna_ingest a write, and the assertion block there still fails provisioning if that
# drifts. Trust decides who you may claim to be; the grants decide what that gets you, and
# the grants are the half FR-018 and SC-003 actually rest on.
#
# `samenet` rather than a subnet literal: it matches any address in a subnet this server is
# directly attached to, which is the compose network whatever address Docker gives it that
# day. A CIDR typed here would be a literal that goes stale the first time the network is
# recreated. Connections arriving through the published port are DNATed and reach the
# server from the bridge gateway, which is in that same subnet.
#
# There is no `all all all` line, and its absence is the boundary: an address off the
# compose network is rejected by the absence of a rule rather than admitted with a
# password. `tests/integration/test_observations_trust_auth.py` asserts that against the
# server's own `pg_hba_file_rules` — what it loaded, not what this file says — and its
# docstring explains why that, rather than a live connection from off the network, is the
# assertion worth making.

# TYPE  DATABASE  USER  ADDRESS  METHOD

# The unix socket inside the container. `deploy/seed.d/010-observations.sh` reaches the
# store this way, through `docker compose exec`, because the store is reachable on the
# compose network whether or not a destination publishes it.
local     all       all            trust

# The compose network: every component's DSN.
host      all       all   samenet  trust
