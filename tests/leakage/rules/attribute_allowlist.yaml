# What a released artefact may say about itself. An allow-list, not a search for known-bad
# strings (FR-012).
#
# The difference is the whole design. A deny-list flags the leaks somebody thought of; an
# allow-list flags the ones nobody did, which is the category the interesting leaks are in.
# An attribute nobody anticipated is a hit here whatever its value, so adding a benign one
# is a deliberate edit to this file rather than something that happens by accident on the
# way through a packager.
#
# Each entry is a key and the pattern its value must match end to end. A key present with a
# value that does not match is a hit naming both, because "title" carrying a filesystem path
# is a leak in an attribute that is otherwise entirely legitimate.

# --- global attributes ---------------------------------------------------------------------
#
# CF's discovery attributes, and nothing that describes how the file was made. `history`,
# `date_created` and library-version attributes are not here on purpose: the environment
# generator does not write them (its `normalised_attributes` records that decision), and a
# file that has acquired one has been through something that added it.
global:
  Conventions: "^CF-1\\.[0-9]{1,2}$"
  title: "^[A-Za-z0-9 ,.()-]{1,120}$"
  summary: "^[A-Za-z0-9 ,.()-]{1,400}$"
  institution: "^[A-Za-z0-9 ]{1,80}$"
  source: "^synthetic$"
  license: "^[A-Za-z0-9.-]{1,40}$"
  standard_name_vocabulary: "^CF Standard Name Table v[0-9]{1,3}$"
  featureType: "^(point|profile|timeSeries|trajectory|grid)$"
  comment: "^[A-Za-z0-9 ,.()-]{1,400}$"

# --- variable attributes ---------------------------------------------------------------------
#
# What a reader needs to interpret a field, and no more. `comment` is permitted and is the
# one most likely to carry something: the leaky control puts a sensor and a datastream
# identifier in exactly that attribute, because that is where such a thing actually ends up.
variable:
  standard_name: "^[a-z][a-z0-9_]{0,80}$"
  long_name: "^[A-Za-z0-9 ,.()-]{1,120}$"
  units: "^[A-Za-z0-9 _/^*.-]{1,40}$"
  axis: "^[XYZT]$"
  positive: "^(up|down)$"
  calendar: "^(standard|gregorian|proleptic_gregorian)$"
  comment: "^[A-Za-z0-9 ,.()-]{1,400}$"
  _FillValue: "^-?[0-9.eE+-]{1,30}$"
  valid_min: "^-?[0-9.eE+-]{1,30}$"
  valid_max: "^-?[0-9.eE+-]{1,30}$"

# --- names ------------------------------------------------------------------------------------
#
# Dimension and coordinate variable names are structure rather than content, but they are
# names all the same and a bundle whose dimension is called `sensor` has disclosed something.
# Data variable names are not listed here: they are bounded by the released variable
# allow-list in the destination configuration (FR-014), which is where a release decides
# what it carries.
dimensions:
  - latitude
  - longitude
  - depth
  - time
coordinates:
  - latitude
  - longitude
  - depth
  - time
