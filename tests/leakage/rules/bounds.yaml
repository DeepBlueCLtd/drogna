# The bounds the updated-region test asserts against. Data, not constants in test source,
# so that changing one is a diff somebody reviews rather than a number somebody edits.
#
# A note on the second name. The specification spells this bound with a word Constitution V
# forbids across every tracked file, and `scripts/check_forbidden_vocabulary.py` refuses it —
# including inside a comment explaining why it is not used, which is why this one is written
# the long way round. The value is spelt `discovery_bound` and means exactly what the
# specification's bound means: the level at or above which the unmitigated control must
# score, or the gate has lost its power and the build fails.
#
# Both figures are printed in the leakage report on every run (SC-005), so a fixture that
# drifted towards a bound is visible before it crosses one rather than afterwards.

# At or below this, a mitigated pair is at chance and the release is not disclosing the
# shape of its own sampling. Set above the largest figure the committed mitigated fixture
# produces (0.022) and far below the smallest the controls produce (1.000), so there is room
# for a fixture to move without either bound becoming a coin toss.
chance_bound: 0.15

# At or above this, the unmitigated control is recovered. A run in which the control scores
# below this fails: a gate that can no longer see a leak it was built to see is not evidence
# that there is no leak.
discovery_bound: 0.60

# Youden's J, which is what the statistic is, sits in [-1, 1] and is zero at chance. Recorded
# here so that a reader of a report knows what scale the figures above are on.
statistic: "youden-j"
